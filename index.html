<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GURU WALI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#0b44ee;
  --blue2:#0635c9;
  --lime:#ccff00;
  --bg:#0d1117;
  --card:#fff;
  --muted:#6b7280;
  --line:#e5e7eb;
  --danger:#ef4444;
  --success:#16a34a
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Poppins,Arial,sans-serif;
  background:var(--bg);
  color:#172033
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.login-card{
  width:min(100%,380px);
  min-height:700px;
  background:var(--blue);
  border-radius:44px;
  overflow:hidden;
  box-shadow:0 25px 70px #0008;
  position:relative
}

.top{
  height:245px;
  background:#f3f3f7;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:48px;
  position:relative
}

.top:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:110px;
  background:var(--blue);
  clip-path:path("M 0 35 C 150 110 320 -15 500 65 L 500 120 L 0 120 Z")
}

.logo{
  width:110px;
  height:110px;
  border-radius:28px;
  object-fit:cover;
  box-shadow:0 10px 30px #0002
}

.login-body{
  padding:25px 28px 28px;
  color:#fff
}

.brand{
  text-align:center;
  margin-bottom:25px
}

.brand h1{
  margin:0;
  font-size:25px;
  font-weight:800
}

.brand p{
  margin:4px 0 0;
  font-size:11px;
  opacity:.8
}

.roles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  background:#0738cf;
  padding:5px;
  border-radius:14px;
  margin-bottom:17px
}

.role{
  border:0;
  border-radius:10px;
  padding:10px 5px;
  color:#b9c7ff;
  background:transparent;
  font-size:11px;
  font-weight:700
}

.role.active{
  background:#fff;
  color:var(--blue)
}

.field-label{
  display:block;
  font-size:11px;
  font-weight:700;
  margin:0 0 7px
}

.input-wrap{
  position:relative
}

.login-input{
  width:100%;
  height:54px;
  border:1px solid #ffffff1a;
  background:#0a3cd4;
  color:white;
  border-radius:16px;
  padding:0 48px 0 16px;
  outline:0
}

.login-input::placeholder{
  color:#b9c7ff
}

.login-input:focus{
  border-color:#fff8;
  box-shadow:0 0 0 3px #fff2
}

.eye{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:#fff8;
  font-size:17px
}

.remember{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:10px;
  margin:13px 2px 16px;
  color:#dbe3ff
}

.remember input{
  accent-color:var(--lime)
}

.login-btn{
  width:100%;
  height:54px;
  border:0;
  border-radius:16px;
  background:var(--lime);
  color:#101828;
  font-weight:800;
  box-shadow:0 10px 25px #0002
}

.login-btn:active{
  transform:scale(.98)
}

.login-btn:disabled{
  opacity:.6
}

.login-help{
  text-align:center;
  font-size:10px;
  color:#dbe3ff;
  margin-top:18px;
  line-height:1.6
}

.footer{
  text-align:center;
  font-size:9px;
  color:#ffffff99;
  margin-top:22px
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
  background:#f4f6fb
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:13px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.header-left{
  display:flex;
  align-items:center;
  gap:11px
}

.header-logo{
  width:42px;
  height:42px;
  border-radius:12px;
  object-fit:cover
}

.header h1{
  font-size:15px;
  margin:0;
  font-weight:800;
  color:#092b83
}

.header small{
  font-size:9px;
  color:#6b7280
}

.logout{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  padding:9px 12px;
  border-radius:11px;
  font-size:10px;
  font-weight:700
}

.layout{
  display:flex;
  max-width:1280px;
  margin:auto;
  min-height:calc(100vh - 69px)
}

.sidebar{
  width:235px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:16px 12px;
  flex:none
}

.nav-title{
  font-size:9px;
  color:#9ca3af;
  font-weight:800;
  margin:8px 10px
}

.nav{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:12px;
  color:#4b5563;
  font-size:11px;
  font-weight:600;
  margin-bottom:3px
}

.nav.active{
  background:#eaf0ff;
  color:var(--blue)
}

.nav span{
  margin-right:9px
}

.content{
  padding:20px;
  flex:1;
  min-width:0
}

.page-title{
  font-size:20px;
  font-weight:800;
  margin:0 0 4px
}

.page-sub{
  font-size:11px;
  color:var(--muted);
  margin:0 0 18px
}

.grid{
  display:grid;
  gap:14px
}

.stats{
  grid-template-columns:repeat(4,1fr)
}

.two{
  grid-template-columns:1fr 1fr
}

.three{
  grid-template-columns:repeat(3,1fr)
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  box-shadow:0 6px 20px #0f172a08
}

.stat .icon{
  font-size:20px
}

.stat .num{
  font-size:25px;
  font-weight:800;
  margin-top:5px
}

.stat .label{
  font-size:10px;
  color:var(--muted)
}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:13px
}

.search{
  height:42px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 13px;
  outline:0;
  background:#fff;
  flex:1;
  min-width:180px;
  font-size:11px
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  font-size:10px;
  font-weight:700
}

.btn-primary{
  background:var(--blue);
  color:#fff
}

.btn-light{
  background:#eef2f7;
  color:#374151
}

.btn-danger{
  background:#fee2e2;
  color:#b91c1c
}

.btn-success{
  background:#dcfce7;
  color:#166534
}

.table-wrap{
  overflow:auto
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:10px
}

.table th{
  background:#f8fafc;
  color:#64748b;
  text-align:left;
  padding:10px;
  white-space:nowrap
}

.table td{
  padding:10px;
  border-top:1px solid #eef0f4;
  vertical-align:top
}

.table tr:hover td{
  background:#fbfdff
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:8px;
  font-weight:700;
  background:#eef2ff;
  color:#3730a3
}

.badge.green{
  background:#dcfce7;
  color:#166534
}

.badge.red{
  background:#fee2e2;
  color:#b91c1c
}

.badge.yellow{
  background:#fef3c7;
  color:#92400e
}

.profile{
  display:flex;
  gap:15px;
  align-items:center
}

.avatar{
  width:78px;
  height:78px;
  border-radius:20px;
  object-fit:cover;
  background:#eef2f7
}

.profile h2{
  font-size:18px;
  margin:0 0 3px
}

.profile p{
  margin:2px 0;
  font-size:10px;
  color:var(--muted)
}

.timeline{
  border-left:2px solid #dbe4ff;
  margin:12px 0 0 8px;
  padding-left:17px
}

.timeline-item{
  position:relative;
  margin-bottom:15px
}

.timeline-item:before{
  content:"";
  position:absolute;
  left:-24px;
  top:4px;
  width:9px;
  height:9px;
  background:var(--blue);
  border-radius:50%;
  box-shadow:0 0 0 4px #eaf0ff
}

.timeline-date{
  font-size:9px;
  color:#64748b
}

.timeline-title{
  font-size:11px;
  font-weight:700;
  margin-top:2px
}

.timeline-text{
  font-size:10px;
  color:#4b5563;
  line-height:1.6;
  margin-top:3px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px
}

.form-group{
  margin-bottom:11px
}

.form-group.full{
  grid-column:1/-1
}

.form-group label{
  display:block;
  font-size:9px;
  font-weight:700;
  color:#4b5563;
  margin-bottom:5px
}

.form-control{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 11px;
  outline:0;
  background:#fff;
  font-size:10px
}

.form-control:focus{
  border-color:#8aa6ff;
  box-shadow:0 0 0 3px #dbe5ff
}

.modal{
  position:fixed;
  inset:0;
  background:#0f172a88;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal-box{
  width:min(100%,560px);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:19px
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px
}

.modal-head h3{
  font-size:15px;
  margin:0
}

.close{
  border:0;
  background:#f3f4f6;
  width:32px;
  height:32px;
  border-radius:9px
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#111827;
  color:#fff;
  padding:12px 15px;
  border-radius:12px;
  font-size:10px;
  z-index:100;
  box-shadow:0 10px 30px #0003
}

.loading{
  opacity:.65;
  pointer-events:none
}

.empty{
  text-align:center;
  padding:30px;
  color:#9ca3af;
  font-size:11px
}

.mobile-nav{
  display:none
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){
  .sidebar{
    width:195px
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .two,.three{
    grid-template-columns:1fr
  }
}

@media(max-width:650px){
  body{
    background:#f4f6fb
  }

  .sidebar{
    display:none
  }

  .content{
    padding:13px 12px 80px
  }

  .header{
    padding:10px 12px
  }

  .header-logo{
    width:37px;
    height:37px
  }

  .header h1{
    font-size:13px
  }

  .layout{
    display:block
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:#fff;
    border-top:1px solid var(--line);
    z-index:30;
    justify-content:space-around;
    padding:6px
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    font-size:8px;
    color:#6b7280;
    font-weight:700
  }

  .mobile-nav button.active{
    color:var(--blue)
  }

  .mobile-nav span{
    display:block;
    font-size:18px;
    margin-bottom:1px
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:9px
  }

  .stat{
    padding:13px
  }

  .stat .num{
    font-size:21px
  }

  .card{
    padding:13px;
    border-radius:15px
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .form-group.full{
    grid-column:auto
  }

  .profile{
    align-items:flex-start
  }

  .avatar{
    width:62px;
    height:62px
  }

  .page-title{
    font-size:17px
  }

  .table{
    font-size:9px
  }

  .login-card{
    min-height:680px
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<section id="loginScreen">

  <div class="login-card">

    <div class="top">
      <img
        class="logo"
        src="https://yanuar-moga.github.io/assets/logo.jpg"
        alt="Logo">
    </div>

    <div class="login-body">

      <div class="brand">
        <h1>GURU WALI</h1>
        <p>Sistem Pemantauan Perkembangan Siswa</p>
      </div>

      <div class="roles">

        <button
          class="role active"
          data-role="WALI"
          onclick="selectRole('WALI')">
          👨‍🏫 GURU WALI
        </button>

        <button
          class="role"
          data-role="SISWA"
          onclick="selectRole('SISWA')">
          🎓 SISWA
        </button>

      </div>

      <label
        class="field-label"
        id="credentialLabel">
        PIN GURU
      </label>

      <div class="input-wrap">

        <input
          id="credential"
          class="login-input"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Masukkan PIN guru"
          onkeydown="if(event.key==='Enter')login()">

        <button
          class="eye"
          onclick="toggleEye()"
          type="button">
          👁
        </button>

      </div>

      <label class="remember">
        <input id="remember" type="checkbox">
        Ingat perangkat ini
      </label>

      <button
        class="login-btn"
        id="loginBtn"
        onclick="login()">
        MASUK
      </button>

      <div
        class="login-help"
        id="loginHelp">
        PIN diverifikasi dari <b>UserAccount</b> pada database sekolah.
      </div>

      <div class="footer">
        SMP NEGERI 1 MOGA • GURU WALI
      </div>

    </div>
  </div>

</section>


<!-- =========================
     MAIN APP
========================= -->

<section id="app" class="hidden">

  <header class="header">

    <div class="header-left">

      <img
        class="header-logo"
        src="https://yanuar-moga.github.io/assets/logo.jpg">

      <div>
        <h1>GURU WALI</h1>
        <small id="headerSchool">
          SMP NEGERI 1 MOGA
        </small>
      </div>

    </div>

    <div style="display:flex;align-items:center;gap:8px">

      <span
        id="headerUser"
        style="font-size:10px;font-weight:700">
      </span>

      <button
        class="logout"
        onclick="logout()">
        Keluar
      </button>

    </div>

  </header>

  <div class="layout">

    <aside
      class="sidebar"
      id="sidebar">
    </aside>

    <main
      class="content"
      id="content">
    </main>

  </div>

  <nav
    class="mobile-nav"
    id="mobileNav">
  </nav>

</section>


<!-- =========================
     MODAL + TOAST
========================= -->

<div
  id="modal"
  class="modal hidden"
  onclick="if(event.target===this)closeModal()">

  <div
    class="modal-box"
    id="modalBox">
  </div>

</div>

<div
  id="toast"
  class="toast hidden">
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbxTZZxRMS4GbN_tca3kEn1hibajLsuqPdsIkVLF-lh9aqO3dDTy8oyJb6HDaZhfxhFfvQ/exec';


/* =========================================================
   STATE
========================================================= */

let state = {
  token:null,
  role:null,
  user:null,
  section:'home',
  students:[],
  selected:null
};


/* =========================================================
   HELPER
========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   ROLE
========================================================= */

function selectRole(role){

  document
    .querySelectorAll('.role')
    .forEach(b =>
      b.classList.toggle(
        'active',
        b.dataset.role === role
      )
    );

  $('credential').value = '';
  $('credential').type = 'password';

  $('credential').placeholder =
    role === 'WALI'
      ? 'Masukkan PIN guru'
      : 'Masukkan PIN atau NISN';

  $('credentialLabel').textContent =
    role === 'WALI'
      ? 'PIN GURU'
      : 'PIN / NISN SISWA';

  $('loginHelp').innerHTML =
    role === 'WALI'
      ? 'PIN guru diverifikasi dari <b>UserAccount</b>.'
      : 'NISN atau PIN siswa diverifikasi dari <b>UserAccount</b>.';
}


function currentRole(){
  return document.querySelector('.role.active').dataset.role;
}


function toggleEye(){

  $('credential').type =
    $('credential').type === 'password'
      ? 'text'
      : 'password';

}


/* =========================================================
   SESSION
========================================================= */

function saveSession(){

  const key = 'waliSiswaSession';

  const store =
    $('remember').checked
      ? localStorage
      : sessionStorage;

  store.setItem(
    key,
    JSON.stringify({
      token:state.token,
      role:state.role,
      user:state.user
    })
  );
}


function loadSession(){

  for(
    const store of [localStorage,sessionStorage]
  ){

    const raw =
      store.getItem('waliSiswaSession');

    if(raw){

      try{
        return JSON.parse(raw);
      }catch(e){}

    }

  }

  return null;
}


function clearSession(){

  localStorage.removeItem(
    'waliSiswaSession'
  );

  sessionStorage.removeItem(
    'waliSiswaSession'
  );

}


/* =========================================================
   API
========================================================= */

async function api(action,data={}){

  if(API_URL.includes('PASTE_URL')){
    throw new Error(
      'API_URL belum diisi pada index.html.'
    );
  }

  const res = await fetch(
    API_URL,
    {
      method:'POST',
      body:JSON.stringify(
        Object.assign(
          {action},
          data
        )
      )
    }
  );

  const json = await res.json();

  if(!json.success){

    throw new Error(
      json.error || 'Terjadi kesalahan.'
    );

  }

  return json;
}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const credential =
    $('credential').value.trim();

  const role =
    currentRole();

  if(!credential){

    toast(
      'Masukkan PIN/NISN terlebih dahulu.',
      true
    );

    return;
  }

  const btn =
    $('loginBtn');

  btn.disabled = true;
  btn.textContent = 'MEMERIKSA...';

  try{

    const r =
      await api(
        'login',
        {
          role,
          credential
        }
      );

    state = {
      token:r.token,
      role:r.role,
      user:r.user,
      section:'home',
      students:[],
      selected:null
    };

    saveSession();

    showApp();

    await render();

    toast(
      'Login berhasil. Selamat datang, ' +
      (r.user.NAMA || '')
    );

  }catch(e){

    toast(
      e.message,
      true
    );

  }finally{

    btn.disabled = false;
    btn.textContent = 'MASUK';

  }

}


/* =========================================================
   AUTO LOGIN
========================================================= */

async function tryAutoLogin(){

  const s =
    loadSession();

  if(!s)return;

  state =
    Object.assign(
      state,
      s
    );

  try{

    await api('health');

    showApp();

    await render();

  }catch(e){

    clearSession();

  }

}


/* =========================================================
   APP
========================================================= */

function showApp(){

  $('loginScreen')
    .classList
    .add('hidden');

  $('app')
    .classList
    .remove('hidden');

  $('headerUser').textContent =
    (state.user?.NAMA || '').toString();

}


function logout(){

  clearSession();

  location.reload();

}


/* =========================================================
   NAVIGATION
========================================================= */

function navItems(){

  if(state.role === 'WALI'){

    return [
      ['home','🏠','Dashboard'],
      ['students','👥','Data Siswa'],
      ['timeline','🕘','Riwayat 7–9'],
      ['notes','📝','Catatan'],
      ['targets','🎯','Target']
    ];

  }

  return [
    ['home','🏠','Beranda'],
    ['timeline','🕘','Perjalanan 7–9'],
    ['notes','📝','Catatan'],
    ['targets','🎯','Target'],
    ['messages','💬','Pesan Wali']
  ];

}


function renderNav(){

  const items =
    navItems();

  $('sidebar').innerHTML =
    '<div class="nav-title">MENU UTAMA</div>' +
    items.map(x => `
      <button
        class="nav ${state.section===x[0]?'active':''}"
        onclick="go('${x[0]}')">

        <span>${x[1]}</span>

    `).join('');

async function go(section){

  state.section =
    section;

  await render();

}


async function render(){

  renderNav();

  if(state.role === 'WALI'){

    if(state.section === 'home')
      return renderTeacherHome();

    if(state.section === 'students')
      return renderStudents();

    if(state.section === 'timeline')
      return renderTimeline();

    if(state.section === 'notes')
      return renderNotes();

    if(state.section === 'targets')
      return renderTargets();

  }else{

    if(state.section === 'home')
      return renderStudentHome();

    if(state.section === 'timeline')
      return renderStudentTimeline();

    if(state.section === 'notes')
      return renderStudentNotes();

    if(state.section === 'targets')
      return renderStudentTargets();

    if(state.section === 'messages')
      return renderStudentMessages();

  }

}


/* =========================================================
   GENERAL HELPERS
========================================================= */

function esc(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[m])
    );

}


function date(v){

  if(!v)return '-';

  const d =
    new Date(v);

  return isNaN(d)
    ? esc(v)
    : d.toLocaleDateString(
        'id-ID',
        {
          day:'2-digit',
          month:'short',
          year:'numeric'
        }
      );

}


function toast(msg,error=false){

  const t =
    $('toast');

  t.textContent =
    msg;

  t.style.background =
    error
      ? '#b91c1c'
      : '#111827';

  t.classList.remove(
    'hidden'
  );

  clearTimeout(
    window.__toast
  );

  window.__toast =
    setTimeout(
      () =>
        t.classList.add('hidden'),
      2800
    );

}


function openModal(html){

  $('modalBox').innerHTML =
    html;

  $('modal')
    .classList
    .remove('hidden');

}


function closeModal(){

  $('modal')
    .classList
    .add('hidden');

}


function stat(icon,num,label){

  return `
    <div class="card stat">

      <div class="icon">${icon}</div>

      <div class="num">${num}</div>

      <div class="label">${label}</div>

    </div>
  `;

}

                all.map(n => `

                      ${esc(n.INDIKATOR || '-')}

          </div>
        `;

  }catch(e){

    $('targetTable').innerHTML =

}

async function saveTarget(){

  try{

    await api(
      'addTarget',
      {
        token:state.token,
        data:{
          SISWA_ID:$('t_siswa').value,
          TARGET:$('t_target').value,
          INDIKATOR:$('t_indikator').value,
          BATAS_WAKTU:$('t_batas').value,
          TINDAK_LANJUT:$('t_follow').value
        }
      }
    );

    closeModal();

    toast(
      'Target berhasil disimpan.'
    );

    go('targets');

  }catch(e){

    toast(
      e.message,
      true
    );

  }

}

function historyHTML(arr){

  return arr.length

    ? arr.map(x => `

        <div class="timeline">

          <div class="timeline-item">

            <div class="timeline-date">
              ${esc(x.TAHUN_AJARAN)}
              •
              Kelas ${esc(x.TINGKAT)}
            </div>

            <div class="timeline-title">
              ${esc(x.ROMBEL || '-')}
            </div>

            <div class="timeline-text">
              Wali kelas:
              ${esc(x.WALI_KELAS || '-')}
            </div>

          </div>

        </div>

      `).join('')

    : `
      <div class="empty">
        Riwayat belum tersedia.
      </div>
    `;

}
