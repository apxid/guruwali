<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wali Siswa</title>
<meta name="theme-color" content="#003b95">
<style>
:root{--primary:#0b44ee;--accent:#ccff00;--bg:#0d1117;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{margin:0;background:var(--bg);min-height:100vh;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0d1117}
.app-container{width:100%;max-width:380px;height:700px;background:#0b44ee;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 25px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
.top-section{background:#f3f3f7;padding-top:55px;padding-bottom:10px;display:flex;flex-direction:column;align-items:center;position:relative}
.logo-container{width:110px;height:110px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:28px;overflow:hidden;box-shadow:0 12px 28px rgba(11,68,238,.12)}
.logo-container img{width:100%;height:100%;object-fit:cover}.wave-container{width:100%;line-height:0;background:#f3f3f7;margin-bottom:-1px}.wave-container svg{width:100%;height:85px;display:block}
.form-section{background:#0b44ee;flex:1;padding:30px 32px 35px;display:flex;flex-direction:column;justify-content:center}
.login-title{text-align:center;color:#fff;margin:-4px 0 18px;font-size:22px;font-weight:800}.login-subtitle{text-align:center;color:rgba(255,255,255,.7);font-size:12px;margin:-8px 0 18px}
.role-switch{display:flex;gap:6px;margin-bottom:16px;background:#0a3cd4;border-radius:16px;padding:5px;border:1px solid rgba(255,255,255,.1)}
.role-switch button{flex:1;height:40px;border-radius:12px;background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:700}.role-switch button.active{background:#fff;color:#0b44ee;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.input-group{position:relative;margin-bottom:16px}.input-box{width:100%;height:54px;background:#0a3cd4;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:0 52px 0 20px;color:#fff;font-size:14px;outline:none;transition:.2s}.input-box::placeholder{color:rgba(255,255,255,.5)}.input-box:focus{border-color:rgba(255,255,255,.4);background:#0834bc}
.input-icon-btn{position:absolute;right:8px;top:7px;width:40px;height:40px;background:transparent;color:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;cursor:pointer}
.options-row{display:flex;align-items:center;margin:12px 0 20px}.remember-label{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,.95);cursor:pointer;user-select:none}.remember-label input{display:none}.custom-checkbox{width:20px;height:20px;background:#ccff00;border-radius:6px;display:flex;align-items:center;justify-content:center}.custom-checkbox::after{content:"✓";color:#000;font-size:13px;font-weight:900}.remember-label input:not(:checked)+.custom-checkbox{background:rgba(255,255,255,.2)}.remember-label input:not(:checked)+.custom-checkbox::after{display:none}
.btn-login{width:100%;height:54px;background:#ccff00;border:none;border-radius:16px;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:.1s}.btn-login:active{transform:scale(.98);background:#b5e600}.login-error{color:#ffd5d5;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:12px;text-align:center;display:none}.login-error.show{display:block}
@media(max-width:480px){.login{padding:0}.app-container{min-height:100vh;height:100vh;max-width:100%;border-radius:0}.top-section{padding-top:48px}.form-section{padding:24px 28px 30px}}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:800;color:var(--primary)}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 64px)}.sidebar{background:#fff;border-right:1px solid var(--border);padding:14px;position:sticky;top:64px;height:calc(100vh - 64px)}.nav button{width:100%;text-align:left;padding:11px 12px;background:transparent;border-radius:10px;margin-bottom:4px}.nav button.active,.nav button:hover{background:#eaf1ff;color:var(--primary);font-weight:700}.content{padding:22px;max-width:1500px;width:100%;margin:auto}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}.stat .n{font-size:28px;font-weight:800;margin-top:5px}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,1fr)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input{flex:1;min-width:180px;padding:10px;border:1px solid var(--border);border-radius:10px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2f7}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.blue{background:#dbeafe;color:#1e40af}
.student-card{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:14px;background:#fff}.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#eaf1ff;color:var(--primary);font-weight:800;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.timeline{position:relative;margin:10px 0 0 10px;padding-left:25px;border-left:2px solid #dbe3ef}.timeline-item{position:relative;padding:0 0 20px}.timeline-item:before{content:"";position:absolute;left:-32px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px #cbd5e1}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:15px;z-index:50}.modal.show{display:grid}.modal-box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;z-index:100;display:none}.toast.show{display:block}
.mobile-nav{display:none}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30;justify-content:space-around;padding:7px}.mobile-nav button{background:transparent;font-size:11px;padding:6px}.content{padding:15px 15px 80px}.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.header{height:58px}.form-grid{grid-template-columns:1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat .n{font-size:22px}.content{padding:12px 10px 80px}.login-card{padding:22px}}
</style>
</head>
<body>
<div id="loginPage" class="login">
  <div class="app-container">
    <div class="top-section">
      <div class="logo-container">
        <img src="https://yanuar-moga.github.io/assets/logo.jpg" alt="Logo SMP Negeri 1 Moga">
      </div>
    </div>
    <div class="wave-container">
      <svg viewBox="0 0 500 120" preserveAspectRatio="none"><path d="M 0,35 C 150,110 320,-15 500,65 L 500,120 L 0,120 Z" fill="#0b44ee"></path></svg>
    </div>
    <div class="form-section">
      <div class="login-title">WALI SISWA</div>
      <div class="login-subtitle">Pemantauan perkembangan siswa kelas 7–9</div>
      <div class="role-switch">
        <button id="tabWali" class="active" type="button" onclick="setRole('WALI')">👨‍🏫 Guru Wali</button>
        <button id="tabSiswa" type="button" onclick="setRole('SISWA')">👨‍🎓 Siswa</button>
      </div>
      <form id="loginForm" onsubmit="event.preventDefault();login()">
        <div class="input-group">
          <input type="password" id="credential" class="input-box" inputmode="numeric" autocomplete="off" placeholder="Masukkan PIN guru" required>
          <button type="button" class="input-icon-btn" id="toggleCredential" aria-label="Tampilkan PIN">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <div class="options-row">
          <label class="remember-label"><input type="checkbox" id="rememberMe" checked><span class="custom-checkbox"></span><span>Ingat perangkat ini</span></label>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="header">
    <div class="brand">📘 WALI SISWA</div>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="userName" class="muted"></span>
      <button class="btn btn-light" onclick="logout()">Keluar</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="nav" id="waliNav">
        <button data-page="dashboard" onclick="showPage('dashboard')">🏠 Dashboard</button>
        <button data-page="students" onclick="showPage('students')">👥 Data Siswa</button>
        <button data-page="followup" onclick="showPage('followup')">📌 Follow Up</button>
      </div>
      <div class="nav hidden" id="studentNav">
        <button data-page="studentHome" onclick="showPage('studentHome')">🏠 Beranda</button>
        <button data-page="studentTimeline" onclick="showPage('studentTimeline')">📖 Perjalanan Saya</button>
        <button data-page="studentMessages" onclick="showPage('studentMessages')">💬 Pesan Wali</button>
      </div>
    </aside>
    <main id="content" class="content"></main>
  </div>
  <nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div>
<div id="toast" class="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxTZZxRMS4GbN_tca3kEn1hibajLsuqPdsIkVLF-lh9aqO3dDTy8oyJb6HDaZhfxhFfvQ/exec
';
const state = {token:localStorage.getItem('waliSiswaToken')||sessionStorage.getItem('waliSiswaToken')||'',role:localStorage.getItem('waliSiswaRole')||sessionStorage.getItem('waliSiswaRole')||'',user:null,students:[],selected:null};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(v){if(!v)return '-'; const d=new Date(v); return isNaN(d)?esc(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function setRole(role){
  document.getElementById('tabWali').classList.toggle('active',role==='WALI');
  document.getElementById('tabSiswa').classList.toggle('active',role==='SISWA');
  const input=document.getElementById('credential');
  input.value='';
  input.placeholder=role==='WALI'?'Masukkan PIN guru':'Masukkan PIN atau NISN';
  input.type='password';
  input.inputMode='numeric';
  document.getElementById('loginError').textContent='';
  document.getElementById('loginError').classList.remove('show');
}
async function api(action,data={}){
  if(API_URL.includes('PASTE_URL')) throw new Error('Isi API_URL terlebih dahulu.');
  const payload={action,...data};
  if(state.token) payload.token=state.token;
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const json=await res.json();
  if(!json.ok) throw new Error(json.error||'Terjadi kesalahan.');
  return json;
}
async function login(){
  const role=document.getElementById('tabWali').classList.contains('active')?'WALI':'SISWA';
  const credential=document.getElementById('credential').value.trim();
  const err=document.getElementById('loginError');
  const btn=document.getElementById('btnLogin');
  err.textContent='';err.classList.remove('show');
  if(!credential){err.textContent=role==='WALI'?'PIN guru wajib diisi.':'PIN atau NISN wajib diisi.';err.classList.add('show');return}
  btn.disabled=true;btn.textContent='Memproses...';
  try{
    const data=await api('login',{role,credential});
    state.token=data.token;state.role=data.role;state.user=data.user;
    if(document.getElementById('rememberMe').checked){
      localStorage.setItem('waliSiswaToken',state.token);localStorage.setItem('waliSiswaRole',state.role);
    }else{
      sessionStorage.setItem('waliSiswaToken',state.token);sessionStorage.setItem('waliSiswaRole',state.role);
    }
    enterApp();
  }catch(e){err.textContent=e.message;err.classList.add('show')}
  finally{btn.disabled=false;btn.textContent='Masuk'}
}
const toggleCredential=document.getElementById('toggleCredential');
toggleCredential.addEventListener('click',()=>{
  const input=document.getElementById('credential');
  input.type=input.type==='password'?'text':'password';
});

function enterApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent=state.user?.NAMA||'';
  const wali=state.role==='WALI';
  document.getElementById('waliNav').classList.toggle('hidden',!wali);
  document.getElementById('studentNav').classList.toggle('hidden',wali);
  document.getElementById('mobileNav').innerHTML=wali
    ? '<button onclick="showPage(\\'dashboard\\')">🏠<br>Home</button><button onclick="showPage(\\'students\\')">👥<br>Siswa</button><button onclick="showPage(\\'followup\\')">📌<br>Follow Up</button>'
    : '<button onclick="showPage(\\'studentHome\\')">🏠<br>Home</button><button onclick="showPage(\\'studentTimeline\\')">📖<br>Perjalanan</button><button onclick="showPage(\\'studentMessages\\')">💬<br>Pesan</button>';
  showPage(wali?'dashboard':'studentHome');
}
async function logout(){
  try{if(state.token)await api('logout')}catch(_){}
  localStorage.removeItem('waliSiswaToken');localStorage.removeItem('waliSiswaRole');sessionStorage.removeItem('waliSiswaToken');sessionStorage.removeItem('waliSiswaRole');
  state.token='';state.role='';state.user=null;
  document.getElementById('app').classList.add('hidden');document.getElementById('loginPage').classList.remove('hidden');
}
async function showPage(page){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const c=document.getElementById('content');
  c.innerHTML='<div class="card">Memuat...</div>';
  try{
    if(page==='dashboard')return renderDashboard();
    if(page==='students')return renderStudents();
    if(page==='followup')return renderFollowups();
    if(page==='studentHome')return renderStudentHome();
    if(page==='studentTimeline')return renderStudentTimeline();
    if(page==='studentMessages')return renderStudentMessages();
  }catch(e){if(/sesi|session/i.test(e.message))return logout(); c.innerHTML='<div class="card" style="color:#b91c1c">'+esc(e.message)+'</div>'}
}
async function renderDashboard(){
  const d=(await api('dashboard')).data;
  document.getElementById('content').innerHTML=`
  <div class="section-title"><div><h2>Dashboard</h2><div class="muted">Ringkasan pemantauan siswa</div></div></div>
  <div class="grid stats">
    <div class="stat">👥<div class="muted">Siswa Aktif</div><div class="n">${d.totalStudents}</div></div>
    <div class="stat">📝<div class="muted">Catatan Bulan Ini</div><div class="n">${d.notesThisMonth}</div></div>
    <div class="stat">⚠️<div class="muted">Perlu Perhatian</div><div class="n">${d.needAttention}</div></div>
    <div class="stat">📌<div class="muted">Follow Up</div><div class="n">${d.pendingFollowups}</div></div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><div class="section-title"><h3>Fitur utama</h3></div>
      <p class="muted">Pilih Data Siswa untuk membuka profil, timeline, catatan konsultasi, perkembangan, target, dan tindak lanjut.</p>
      <button class="btn btn-primary" onclick="showPage('students')">Buka Data Siswa</button>
    </div>
    <div class="card"><h3>Target aktif</h3><div style="font-size:30px;font-weight:800">${d.pendingTargets}</div><div class="muted">target yang masih berjalan</div></div>
  </div>`;
}
async function renderStudents(){
  const data=(await api('students')).data;state.students=data;
  document.getElementById('content').innerHTML=`
    <div class="section-title"><div><h2>Data Siswa</h2><div class="muted">${data.length} siswa</div></div><button class="btn btn-primary" onclick="studentForm()">+ Siswa</button></div>
    <div class="toolbar"><input id="searchStudent" placeholder="Cari nama / NISN / NIS..." oninput="filterStudents()"></div>
    <div id="studentList" class="grid three"></div>`;
  paintStudents(data);
}
function filterStudents(){const q=document.getElementById('searchStudent').value.toLowerCase();paintStudents(state.students.filter(s=>String(s.NAMA).toLowerCase().includes(q)||String(s.NISN).includes(q)||String(s.NIS).includes(q)))}
function paintStudents(data){
  const el=document.getElementById('studentList');
  if(!data.length){el.innerHTML='<div class="card empty">Data siswa tidak ditemukan.</div>';return}
  el.innerHTML=data.map(s=>`<div class="student-card" onclick="openStudent('${esc(s.SISWA_ID)}')" style="cursor:pointer">
    <div class="avatar">${s.FOTO_URL?`<img src="${esc(s.FOTO_URL)}">`:esc(String(s.NAMA||'?').charAt(0))}</div>
    <div style="min-width:0"><b>${esc(s.NAMA)}</b><div class="muted">${esc(s.NISN)} · ${esc(s.JK||'')}</div><div><span class="badge blue">${esc(s.STATUS||'AKTIF')}</span></div></div>
  </div>`).join('');
}
async function openStudent(id){
  const d=(await api('studentProfile',{siswaId:id})).data;state.selected=d;
  document.getElementById('content').innerHTML=`
  <div class="section-title"><div><button class="btn btn-light" onclick="showPage('students')">← Kembali</button></div>
    <div style="text-align:right"><button class="btn btn-primary" onclick="noteForm()">+ Catatan</button> <button class="btn btn-light" onclick="developmentForm()">📈 Perkembangan</button></div></div>
  <div class="card">
    <div style="display:flex;gap:15px;align-items:center"><div class="avatar" style="width:68px;height:68px">${d.student.FOTO_URL?`<img src="${esc(d.student.FOTO_URL)}">`:esc(String(d.student.NAMA||'?').charAt(0))}</div>
    <div><h2>${esc(d.student.NAMA)}</h2><div class="muted">NISN ${esc(d.student.NISN)} · ${esc(d.student.JK||'')} · ${esc(d.student.STATUS||'')}</div></div></div>
    <hr style="border:0;border-top:1px solid var(--border);margin:15px 0">
    <div class="grid three"><div><b>Tempat Lahir</b><div class="muted">${esc(d.student.TEMPAT_LAHIR||'-')}</div></div><div><b>Tanggal Lahir</b><div class="muted">${fmtDate(d.student.TGL_LAHIR)}</div></div><div><b>Tahun Masuk</b><div class="muted">${esc(d.student.TAHUN_MASUK||'-')}</div></div></div>
  </div>
  <div class="grid two" style="margin-top:14px">
    <div class="card"><div class="section-title"><h3>📖 Riwayat Kelas 7–9</h3><button class="btn btn-light" onclick="historyForm()">+ Riwayat</button></div>${historyHtml(d.history)}</div>
    <div class="card"><div class="section-title"><h3>💬 Pesan Wali</h3><button class="btn btn-light" onclick="messageForm()">+ Pesan</button></div>${messagesHtml(d.messages)}</div>
  </div>
  <div class="card" style="margin-top:14px"><div class="section-title"><h3>📝 Timeline Catatan</h3></div>${timelineHtml(d.notes,true)}</div>
  <div class="card" style="margin-top:14px"><div class="section-title"><h3>📈 Perkembangan</h3></div>${developmentHtml(d.development)}</div>
  <div class="card" style="margin-top:14px"><div class="section-title"><h3>🎯 Target</h3><button class="btn btn-light" onclick="targetForm()">+ Target</button></div>${targetsHtml(d.targets)}</div>`;
}
function historyHtml(a){if(!a.length)return '<div class="empty">Belum ada riwayat kelas.</div>';return '<div class="table-wrap"><table class="table"><tr><th>Tahun</th><th>Kelas</th><th>Rombel</th><th>Wali</th></tr>'+a.sort((x,y)=>String(x.TAHUN_AJARAN).localeCompare(String(y.TAHUN_AJARAN))).map(x=>`<tr><td>${esc(x.TAHUN_AJARAN)}</td><td>${esc(x.TINGKAT)}</td><td>${esc(x.ROMBEL)}</td><td>${esc(x.WALI_KELAS||'-')}</td></tr>`).join('')+'</table></div>'}
function timelineHtml(a,canEdit=false){if(!a.length)return '<div class="empty">Belum ada catatan.</div>';return '<div class="timeline">'+a.map(n=>`<div class="timeline-item"><b>${fmtDate(n.TANGGAL)} · ${esc(n.JENIS)}</b><div style="margin-top:5px"><b>${esc(n.TOPIK)}</b></div><div class="muted">${esc(n.CATATAN_SISWA||n.CATATAN_INTERNAL||n.PERKEMBANGAN||'')}</div><div style="margin-top:6px"><span class="badge ${n.STATUS==='PERLU_PERHATIAN'?'yellow':n.STATUS==='TINDAK_LANJUT'?'red':'green'}">${esc(n.STATUS)}</span> <span class="badge">${esc(n.VISIBILITAS)}</span></div>${canEdit?`<button class="btn btn-light" style="margin-top:7px;padding:6px 9px" onclick="noteForm('${esc(n.CATATAN_ID)}')">Edit</button>`:''}</div>`).join('')+'</div>'}
function developmentHtml(a){if(!a.length)return '<div class="empty">Belum ada penilaian perkembangan.</div>';return '<div class="table-wrap"><table class="table"><tr><th>Tanggal</th><th>Tingkat</th><th>Akademik</th><th>Disiplin</th><th>Tanggung Jawab</th><th>Sosial</th><th>Kemandirian</th><th>Keaktifan</th></tr>'+a.map(x=>`<tr><td>${fmtDate(x.TANGGAL)}</td><td>${esc(x.TINGKAT)}</td><td>${esc(x.AKADEMIK)}</td><td>${esc(x.DISIPLIN)}</td><td>${esc(x.TANGGUNG_JAWAB)}</td><td>${esc(x.SOSIAL)}</td><td>${esc(x.KEMANDIRIAN)}</td><td>${esc(x.KEAKTIFAN)}</td></tr>`).join('')+'</table></div>'}
function targetsHtml(a){if(!a.length)return '<div class="empty">Belum ada target.</div>';return a.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><b>${esc(x.TARGET)}</b><div class="muted">${esc(x.INDIKATOR||'')} · batas ${fmtDate(x.BATAS_WAKTU)}</div><span class="badge ${x.STATUS==='SELESAI'?'green':'yellow'}">${esc(x.STATUS)}</span></div>`).join('')}
function messagesHtml(a){if(!a.length)return '<div class="empty">Belum ada pesan.</div>';return a.slice(0,5).map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b>${esc(x.JUDUL)}</b><div class="muted">${fmtDate(x.TANGGAL)}</div><div style="font-size:13px">${esc(x.PESAN)}</div></div>`).join('')}
function openModal(title,body){document.getElementById('modalBox').innerHTML=`<h3>${title}</h3>${body}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function studentForm(){
  openModal('Tambah Siswa',`<div class="form-grid">
  ${field('nisn','NISN')} ${field('nis','NIS')} ${field('nama','Nama Lengkap')} ${field('jk','Jenis Kelamin','select',['L','P'])}
  ${field('tempatLahir','Tempat Lahir')} ${field('tglLahir','Tanggal Lahir','date')} ${field('alamat','Alamat','textarea','', 'full')}
  ${field('namaAyah','Nama Ayah')} ${field('namaIbu','Nama Ibu')} ${field('noHpOrangTua','No. HP Orang Tua')}
  ${field('tahunMasuk','Tahun Masuk')} ${field('fotoUrl','URL Foto')}
  </div><div class="actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveStudent()">Simpan</button></div>`);
}
function field(id,label,type='text',opts='',cls=''){
  if(type==='select')return `<div class="field ${cls}"><label>${label}</label><select id="f_${id}"><option value="">Pilih</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
  return `<div class="field ${cls}"><label>${label}</label>${type==='textarea'?`<textarea id="f_${id}"></textarea>`:`<input id="f_${id}" type="${type}" ${opts==='full'?'':''}>`}</div>`;
}
function val(id){return document.getElementById('f_'+id)?.value||''}
async function saveStudent(){
  try{const r=await api('saveStudent',{nisn:val('nisn'),nis:val('nis'),nama:val('nama'),jk:val('jk'),tempatLahir:val('tempatLahir'),tglLahir:val('tglLahir'),alamat:val('alamat'),namaAyah:val('namaAyah'),namaIbu:val('namaIbu'),noHpOrangTua:val('noHpOrangTua'),tahunMasuk:val('tahunMasuk'),fotoUrl:val('fotoUrl')});closeModal();toast('Siswa tersimpan');showPage('students')}catch(e){toast(e.message)}}
function noteForm(id=''){
  const old=id?state.selected.notes.find(x=>String(x.CATATAN_ID)===String(id)):null;
  openModal(old?'Edit Catatan':'Tambah Catatan',`<div class="form-grid">
  ${field('tanggal','Tanggal','date')} ${field('jenis','Jenis','select',['AKADEMIK','KEDISIPLINAN','SOSIAL','PRIBADI','KARAKTER','ORGANISASI','KARIER','LAINNYA'])}
  ${field('topik','Topik')} ${field('status','Status','select',['NORMAL','PERLU_PERHATIAN','TINDAK_LANJUT','SELESAI'])}
  ${field('catatanInternal','Catatan Internal','textarea','', 'full')}
  ${field('catatanSiswa','Catatan untuk Siswa','textarea','', 'full')}
  ${field('perkembangan','Perkembangan','textarea','', 'full')}
  ${field('tindakLanjut','Tindak Lanjut','textarea','', 'full')}
  ${field('visibilitas','Visibilitas','select',['INTERNAL','SISWA'])}
  </div><div class="actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveNote('${id}')">Simpan</button></div>`);
  if(old){['tanggal','jenis','topik','status','catatanInternal','catatanSiswa','perkembangan','tindakLanjut','visibilitas'].forEach(k=>{const el=document.getElementById('f_'+k);if(el)el.value=old[k==='catatanInternal'?'CATATAN_INTERNAL':k==='catatanSiswa'?'CATATAN_SISWA':k==='tindakLanjut'?'TINDAK_LANJUT':k.toUpperCase()]||''})}
  else document.getElementById('f_tanggal').value=new Date().toISOString().slice(0,10);
}
async function saveNote(id){
  try{
    const data={siswaId:state.selected.student.SISWA_ID,tanggal:val('tanggal'),jenis:val('jenis'),topik:val('topik'),status:val('status'),catatanInternal:val('catatanInternal'),catatanSiswa:val('catatanSiswa'),perkembangan:val('perkembangan'),tindakLanjut:val('tindakLanjut'),visibilitas:val('visibilitas')};
    await api(id?'updateNote':'addNote',id?{...data,catatanId:id}:data);closeModal();toast('Catatan tersimpan');openStudent(state.selected.student.SISWA_ID);
  }catch(e){toast(e.message)}
}
function developmentForm(){
  openModal('Tambah Perkembangan',`<div class="form-grid">${field('tanggal','Tanggal','date')}${field('tingkat','Tingkat','select',['7','8','9'])}
  ${field('akademik','Akademik','select',['1','2','3','4'])}${field('disiplin','Disiplin','select',['1','2','3','4'])}
  ${field('tanggungJawab','Tanggung Jawab','select',['1','2','3','4'])}${field('sosial','Sosial','select',['1','2','3','4'])}
  ${field('kemandirian','Kemandirian','select',['1','2','3','4'])}${field('keaktifan','Keaktifan','select',['1','2','3','4'])}
  ${field('catatan','Catatan','textarea','', 'full')}</div><div class="actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveDevelopment()">Simpan</button></div>`);
  document.getElementById('f_tanggal').value=new Date().toISOString().slice(0,10);
  document.getElementById('f_tingkat').value='9';
}
async function saveDevelopment(){
  try{await api('addDevelopment',{siswaId:state.selected.student.SISWA_ID,tanggal:val('tanggal'),tingkat:val('tingkat'),akademik:val('akademik'),disiplin:val('disiplin'),tanggungJawab:val('tanggungJawab'),sosial:val('sosial'),kemandirian:val('kemandirian'),keaktifan:val('keaktifan'),catatan:val('catatan')});closeModal();toast('Perkembangan tersimpan');openStudent(state.selected.student.SISWA_ID)}catch(e){toast(e.message)}}
function targetForm(){
  openModal('Tambah Target',`<div class="form-grid">${field('tanggal','Tanggal','date')}${field('batasWaktu','Batas Waktu','date')}${field('target','Target','text','','full')}${field('indikator','Indikator Keberhasilan','textarea','', 'full')}${field('tindakLanjut','Tindak Lanjut','textarea','', 'full')}</div><div class="actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveTarget()">Simpan</button></div>`);
  document.getElementById('f_tanggal').value=new Date().toISOString().slice(0,10);
}
async function saveTarget(){try{await api('addTarget',{siswaId:state.selected.student.SISWA_ID,tanggal:val('tanggal'),target:val('target'),indikator:val('indikator'),batasWaktu:val('batasWaktu'),tindakLanjut:val('tindakLanjut')});closeModal();toast('Target tersimpan');openStudent(state.selected.student.SISWA_ID)}catch(e){toast(e.message)}}
function historyForm(){
  openModal('Tambah Riwayat Kelas',`<div class="form-grid">${field('tahunAjaran','Tahun Ajaran')}${field('tingkat','Tingkat','select',['7','8','9'])}${field('rombel','Rombel')}${field('waliKelas','Wali Kelas')}</div><div class="actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveHistory()">Simpan</button></div>`);
}
async function saveHistory(){try{await api('saveClassHistory',{siswaId:state.selected.student.SISWA_ID,tahunAjaran:val('tahunAjaran'),tingkat:val('tingkat'),rombel:val('rombel'),waliKelas:val('waliKelas')});closeModal();toast('Riwayat tersimpan');openStudent(state.selected.student.SISWA_ID)}catch(e){toast(e.message)}}
function messageForm(){
  openModal('Pesan untuk Siswa',`<div class="field"><label>Judul</label><input id="msgTitle"></div><div class="field"><label>Pesan</label><textarea id="msgText"></textarea></div><div class="actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveMessage()">Kirim</button></div>`);
}
async function saveMessage(){try{await api('addMessage',{siswaId:state.selected.student.SISWA_ID,judul:document.getElementById('msgTitle').value,pesan:document.getElementById('msgText').value});closeModal();toast('Pesan dikirim');openStudent(state.selected.student.SISWA_ID)}catch(e){toast(e.message)}}
async function renderFollowups(){
  const students=(await api('students')).data;
  document.getElementById('content').innerHTML='<h2>Follow Up</h2><div class="muted">Daftar tindak lanjut dikelola melalui profil masing-masing siswa.</div><div class="card" style="margin-top:14px"><div class="table-wrap"><table class="table"><tr><th>Siswa</th><th>NISN</th><th>Aksi</th></tr>'+students.map(s=>`<tr><td>${esc(s.NAMA)}</td><td>${esc(s.NISN)}</td><td><button class="btn btn-light" onclick="openStudent('${esc(s.SISWA_ID)}')">Buka Profil</button></td></tr>`).join('')+'</table></div></div>';
}
async function renderStudentHome(){
  const d=(await api('studentDashboard')).data;
  document.getElementById('content').innerHTML=`<div class="card" style="margin-bottom:14px"><div class="muted">Selamat datang,</div><h1>${esc(d.student.NAMA)}</h1><div class="muted">NISN ${esc(d.student.NISN)}</div></div>
  <div class="grid stats"><div class="stat">📖<div class="muted">Riwayat Kelas</div><div class="n">${d.history.length}</div></div><div class="stat">📝<div class="muted">Catatan Dibagikan</div><div class="n">${d.notes.length}</div></div><div class="stat">🎯<div class="muted">Target</div><div class="n">${d.targets.length}</div></div><div class="stat">💬<div class="muted">Pesan</div><div class="n">${d.messages.length}</div></div></div>
  <div class="grid two" style="margin-top:14px"><div class="card"><h3>📝 Catatan Terbaru</h3>${timelineHtml(d.notes)}</div><div class="card"><h3>💬 Pesan Wali</h3>${messagesHtml(d.messages)}</div></div>`;
}
async function renderStudentTimeline(){
  const d=(await api('studentDashboard')).data;
  document.getElementById('content').innerHTML=`<div class="card"><h2>📖 Perjalanan Saya</h2><div class="muted">Riwayat kelas 7 sampai 9</div>${historyHtml(d.history)}</div><div class="card" style="margin-top:14px"><h3>Timeline Catatan</h3>${timelineHtml(d.notes)}</div><div class="card" style="margin-top:14px"><h3>Perkembangan</h3>${developmentHtml(d.development)}</div><div class="card" style="margin-top:14px"><h3>Target</h3>${targetsHtml(d.targets)}</div>`;
}
async function renderStudentMessages(){
  const a=(await api('myMessages')).data;
  document.getElementById('content').innerHTML=`<div class="card"><h2>💬 Pesan Wali</h2>${messagesHtml(a)}</div>`;
}
window.addEventListener('DOMContentLoaded',()=>{
  if(state.token && state.role){
    // Token may have expired; validate by loading dashboard.
    state.user={NAMA:''};
    enterApp();
  }
  document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
});
</script>
</body>
</html>
