<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>GURU WALI</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   GLOBAL THEME
   Login + Dashboard menggunakan identitas warna yang sama
===================================================== */

:root{

  --blue:#0B44EE;
  --blue2:#0635C9;
  --blue3:#0A3CD4;

  --blue-soft:#EAF0FF;
  --blue-soft-2:#F3F6FF;

  --bg:#F4F6FB;

  --card:#FFFFFF;

  --text:#172033;
  --text-dark:#092B83;

  --muted:#6B7280;

  --line:#E5E7EB;

  --danger:#EF4444;
  --success:#16A34A;
  --warning:#F59E0B;

  --danger-soft:#FEE2E2;
  --success-soft:#DCFCE7;
  --warning-soft:#FEF3C7;

  --shadow:0 6px 20px #0f172a08;

}


*{
  box-sizing:border-box;
}


html,
body{

  margin:0;

  min-height:100%;

  font-family:
    Poppins,
    Arial,
    sans-serif;

  background:var(--bg);

  color:var(--text);

}


button,
input,
select,
textarea{

  font:inherit;

}


button{

  cursor:pointer;

}


.hidden{

  display:none!important;

}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen{

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top left,
      #EAF0FF 0%,
      #F4F6FB 42%,
      #F4F6FB 100%
    );

}


.login-card{

  width:min(100%,380px);

  min-height:700px;

  background:#fff;

  border-radius:30px;

  overflow:hidden;

  position:relative;

  border:1px solid #E5E7EB;

  box-shadow:
    0 25px 70px #0B2A6B1A;

}


/* =====================================================
   LOGIN TOP
===================================================== */

.top{

  height:245px;

  background:
    linear-gradient(
      145deg,
      var(--blue),
      var(--blue2)
    );

  display:flex;

  align-items:flex-start;

  justify-content:center;

  padding-top:48px;

  position:relative;

  overflow:hidden;

}


/* Decorative background */

.top:before{

  content:"";

  position:absolute;

  width:220px;

  height:220px;

  border-radius:50%;

  background:#ffffff10;

  top:-110px;

  right:-70px;

}


.top:after{

  content:"";

  position:absolute;

  left:-10%;

  right:-10%;

  bottom:-65px;

  height:120px;

  background:#fff;

  border-radius:50% 50% 0 0 / 70% 70% 0 0;

}


/* =====================================================
   LOGIN LOGO
===================================================== */

.logo{

  width:110px;

  height:110px;

  border-radius:28px;

  object-fit:cover;

  position:relative;

  z-index:2;

  background:#fff;

  padding:4px;

  box-shadow:
    0 12px 35px #031b5c45;

}


/* =====================================================
   LOGIN BODY
===================================================== */

.login-body{

  padding:18px 28px 28px;

  color:var(--text);

  background:#fff;

}


/* =====================================================
   BRAND
===================================================== */

.brand{

  text-align:center;

  margin-bottom:24px;

}


.brand h1{

  margin:0;

  font-size:25px;

  font-weight:800;

  color:var(--text-dark);

  letter-spacing:.2px;

}


.brand p{

  margin:4px 0 0;

  font-size:11px;

  color:var(--muted);

}


/* =====================================================
   ROLE SWITCH
===================================================== */

.roles{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:5px;

  background:var(--blue-soft);

  padding:5px;

  border-radius:14px;

  margin-bottom:17px;

  border:1px solid #DCE6FF;

}


.role{

  border:0;

  border-radius:10px;

  padding:10px 5px;

  color:#64748B;

  background:transparent;

  font-size:11px;

  font-weight:700;

  transition:
    .2s ease;

}


.role:hover{

  background:#ffffff99;

}


.role.active{

  background:#fff;

  color:var(--blue);

  box-shadow:
    0 3px 10px #0B44EE14;

}


/* =====================================================
   LOGIN LABEL
===================================================== */

.field-label{

  display:block;

  font-size:11px;

  font-weight:700;

  color:#374151;

  margin:0 0 7px;

}


/* =====================================================
   LOGIN INPUT
===================================================== */

.input-wrap{

  position:relative;

}


.login-input{

  width:100%;

  height:54px;

  border:1px solid var(--line);

  background:#F8FAFC;

  color:#172033;

  border-radius:16px;

  padding:
    0
    48px
    0
    16px;

  outline:0;

  transition:
    .2s ease;

}


.login-input::placeholder{

  color:#9CA3AF;

}


.login-input:hover{

  border-color:#C9D4EE;

}


.login-input:focus{

  border-color:#8AA6FF;

  background:#fff;

  box-shadow:
    0 0 0 3px #DBE5FF;

}


/* =====================================================
   PASSWORD EYE
===================================================== */

.eye{

  position:absolute;

  right:12px;

  top:50%;

  transform:translateY(-50%);

  border:0;

  background:transparent;

  color:#64748B;

  font-size:17px;

  padding:5px;

}


.eye:hover{

  color:var(--blue);

}


/* =====================================================
   REMEMBER
===================================================== */

.remember{

  display:flex;

  align-items:center;

  gap:8px;

  font-size:10px;

  margin:13px 2px 16px;

  color:#64748B;

}


.remember input{

  accent-color:var(--blue);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{

  width:100%;

  height:54px;

  border:0;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#fff;

  font-weight:800;

  box-shadow:
    0 10px 25px #0B44EE2E;

  transition:
    transform .15s ease,
    box-shadow .2s ease,
    opacity .2s ease;

}


.login-btn:hover{

  box-shadow:
    0 12px 30px #0B44EE40;

  transform:translateY(-1px);

}


.login-btn:active{

  transform:scale(.98);

}


.login-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

}


/* =====================================================
   LOGIN HELP
===================================================== */

.login-help{

  text-align:center;

  font-size:10px;

  color:#64748B;

  margin-top:18px;

  line-height:1.6;

}


.login-help b{

  color:var(--blue);

}


/* =====================================================
   LOGIN FOOTER
===================================================== */

.footer{

  text-align:center;

  font-size:9px;

  color:#9CA3AF;

  margin-top:22px;

}


/* =====================================================
   APP
===================================================== */

#app{

  min-height:100vh;

  background:var(--bg);

}


/* =====================================================
   HEADER
===================================================== */

.header{

  position:sticky;

  top:0;

  z-index:20;

  background:#fff;

  border-bottom:1px solid var(--line);

  padding:13px 18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}


.header-left{

  display:flex;

  align-items:center;

  gap:11px;

}


.header-logo{

  width:42px;

  height:42px;

  border-radius:12px;

  object-fit:cover;

}


.header h1{

  font-size:15px;

  margin:0;

  font-weight:800;

  color:var(--text-dark);

}


.header small{

  font-size:9px;

  color:var(--muted);

}


/* =====================================================
   LOGOUT
===================================================== */

.logout{

  border:0;

  background:var(--danger-soft);

  color:#B91C1C;

  padding:9px 12px;

  border-radius:11px;

  font-size:10px;

  font-weight:700;

}


.logout:hover{

  background:#FECACA;

}


/* =====================================================
   LAYOUT
===================================================== */

.layout{

  display:flex;

  max-width:1280px;

  margin:auto;

  min-height:
    calc(100vh - 69px);

}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{

  width:235px;

  background:#fff;

  border-right:1px solid var(--line);

  padding:16px 12px;

  flex:none;

}


.nav-title{

  font-size:9px;

  color:#9CA3AF;

  font-weight:800;

  margin:8px 10px;

}


.nav{

  width:100%;

  border:0;

  background:transparent;

  text-align:left;

  padding:11px 12px;

  border-radius:12px;

  color:#4B5563;

  font-size:11px;

  font-weight:600;

  margin-bottom:3px;

  transition:
    .2s ease;

}


.nav:hover{

  background:#F5F7FB;

  color:var(--blue);

}


.nav.active{

  background:var(--blue-soft);

  color:var(--blue);

}


.nav span{

  margin-right:9px;

}


/* =====================================================
   CONTENT
===================================================== */

.content{

  padding:20px;

  flex:1;

  min-width:0;

}


.page-title{

  font-size:20px;

  font-weight:800;

  margin:0 0 4px;

}


.page-sub{

  font-size:11px;

  color:var(--muted);

  margin:0 0 18px;

}


/* =====================================================
   GRID
===================================================== */

.grid{

  display:grid;

  gap:14px;

}


.stats{

  grid-template-columns:
    repeat(4,1fr);

}


.two{

  grid-template-columns:
    1fr 1fr;

}


.three{

  grid-template-columns:
    repeat(3,1fr);

}


/* =====================================================
   CARD
===================================================== */

.card{

  background:#fff;

  border:1px solid var(--line);

  border-radius:18px;

  padding:17px;

  box-shadow:var(--shadow);

}


.card:hover{

  box-shadow:
    0 8px 24px #0f172a0C;

}


/* =====================================================
   STAT
===================================================== */

.stat .icon{

  font-size:20px;

}


.stat .num{

  font-size:25px;

  font-weight:800;

  margin-top:5px;

  color:#172033;

}


.stat .label{

  font-size:10px;

  color:var(--muted);

}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{

  display:flex;

  gap:9px;

  flex-wrap:wrap;

  margin-bottom:13px;

}


.search{

  height:42px;

  border:1px solid var(--line);

  border-radius:12px;

  padding:0 13px;

  outline:0;

  background:#fff;

  flex:1;

  min-width:180px;

  font-size:11px;

}


.search:focus{

  border-color:#8AA6FF;

  box-shadow:
    0 0 0 3px #DBE5FF;

}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

  border:0;

  border-radius:11px;

  padding:10px 14px;

  font-size:10px;

  font-weight:700;

  transition:
    .15s ease;

}


.btn:hover{

  transform:translateY(-1px);

}


.btn:active{

  transform:scale(.98);

}


.btn-primary{

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:#fff;

  box-shadow:
    0 5px 14px #0B44EE20;

}


.btn-light{

  background:#EEF2F7;

  color:#374151;

}


.btn-light:hover{

  background:#E5EAF2;

}


.btn-danger{

  background:var(--danger-soft);

  color:#B91C1C;

}


.btn-success{

  background:var(--success-soft);

  color:#166534;

}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{

  overflow:auto;

}


.table{

  width:100%;

  border-collapse:collapse;

  font-size:10px;

}


.table th{

  background:#F8FAFC;

  color:#64748B;

  text-align:left;

  padding:10px;

  white-space:nowrap;

}


.table td{

  padding:10px;

  border-top:1px solid #EEF0F4;

  vertical-align:top;

}


.table tr:hover td{

  background:#FBFDFF;

}


/* =====================================================
   BADGE
===================================================== */

.badge{

  display:inline-block;

  padding:4px 8px;

  border-radius:999px;

  font-size:8px;

  font-weight:700;

  background:#EEF2FF;

  color:#3730A3;

}


.badge.green{

  background:var(--success-soft);

  color:#166534;

}


.badge.red{

  background:var(--danger-soft);

  color:#B91C1C;

}


.badge.yellow{

  background:var(--warning-soft);

  color:#92400E;

}


/* =====================================================
   PROFILE
===================================================== */

.profile{

  display:flex;

  gap:15px;

  align-items:center;

}


.avatar{

  width:78px;

  height:78px;

  border-radius:20px;

  object-fit:cover;

  background:#EEF2F7;

}


.profile h2{

  font-size:18px;

  margin:0 0 3px;

}


.profile p{

  margin:2px 0;

  font-size:10px;

  color:var(--muted);

}


/* =====================================================
   TIMELINE
===================================================== */

.timeline{

  border-left:2px solid #DBE4FF;

  margin:12px 0 0 8px;

  padding-left:17px;

}


.timeline-item{

  position:relative;

  margin-bottom:15px;

}


.timeline-item:before{

  content:"";

  position:absolute;

  left:-24px;

  top:4px;

  width:9px;

  height:9px;

  background:var(--blue);

  border-radius:50%;

  box-shadow:
    0 0 0 4px var(--blue-soft);

}


.timeline-date{

  font-size:9px;

  color:#64748B;

}


.timeline-title{

  font-size:11px;

  font-weight:700;

  margin-top:2px;

}


.timeline-text{

  font-size:10px;

  color:#4B5563;

  line-height:1.6;

  margin-top:3px;

}


/* =====================================================
   FORM
===================================================== */

.form-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;

}


.form-group{

  margin-bottom:11px;

}


.form-group.full{

  grid-column:1/-1;

}


.form-group label{

  display:block;

  font-size:9px;

  font-weight:700;

  color:#4B5563;

  margin-bottom:5px;

}


.form-control{

  width:100%;

  border:1px solid var(--line);

  border-radius:10px;

  padding:10px 11px;

  outline:0;

  background:#fff;

  font-size:10px;

}


.form-control:focus{

  border-color:#8AA6FF;

  box-shadow:
    0 0 0 3px #DBE5FF;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  background:#0F172A88;

  z-index:50;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:18px;

}


.modal-box{

  width:min(100%,560px);

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:20px;

  padding:19px;

}


.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:15px;

}


.modal-head h3{

  font-size:15px;

  margin:0;

}


.close{

  border:0;

  background:#F3F4F6;

  width:32px;

  height:32px;

  border-radius:9px;

}


.close:hover{

  background:#E5E7EB;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  right:18px;

  bottom:18px;

  background:#111827;

  color:#fff;

  padding:12px 15px;

  border-radius:12px;

  font-size:10px;

  z-index:100;

  box-shadow:
    0 10px 30px #0003;

}


.loading{

  opacity:.65;

  pointer-events:none;

}


.empty{

  text-align:center;

  padding:30px;

  color:#9CA3AF;

  font-size:11px;

}


/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav{

  display:none;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:850px){

  .sidebar{

    width:195px;

  }


  .stats{

    grid-template-columns:
      repeat(2,1fr);

  }


  .two,
  .three{

    grid-template-columns:1fr;

  }

}


@media(max-width:650px){

  body{

    background:var(--bg);

  }


  #loginScreen{

    padding:14px;

  }


  .login-card{

    min-height:680px;

    border-radius:28px;

  }


  .top{

    height:230px;

  }


  .logo{

    width:100px;

    height:100px;

    border-radius:25px;

  }


  .login-body{

    padding:
      15px
      22px
      25px;

  }


  .brand h1{

    font-size:23px;

  }


  .sidebar{

    display:none;

  }


  .content{

    padding:
      13px
      12px
      80px;

  }


  .header{

    padding:
      10px
      12px;

  }


  .header-logo{

    width:37px;

    height:37px;

  }


  .header h1{

    font-size:13px;

  }


  .layout{

    display:block;

  }


  .mobile-nav{

    display:flex;

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:62px;

    background:#fff;

    border-top:1px solid var(--line);

    z-index:30;

    justify-content:space-around;

    padding:6px;

    box-shadow:
      0 -4px 15px #0f172a08;

  }


  .mobile-nav button{

    border:0;

    background:transparent;

    font-size:8px;

    color:#6B7280;

    font-weight:700;

  }


  .mobile-nav button.active{

    color:var(--blue);

  }


  .mobile-nav span{

    display:block;

    font-size:18px;

    margin-bottom:1px;

  }


  .stats{

    grid-template-columns:
      1fr 1fr;

    gap:9px;

  }


  .stat{

    padding:13px;

  }


  .stat .num{

    font-size:21px;

  }


  .card{

    padding:13px;

    border-radius:15px;

  }


  .form-grid{

    grid-template-columns:1fr;

  }


  .form-group.full{

    grid-column:auto;

  }


  .profile{

    align-items:flex-start;

  }


  .avatar{

    width:62px;

    height:62px;

  }


  .page-title{

    font-size:17px;

  }


  .table{

    font-size:9px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-card">


    <!-- LOGIN TOP -->

    <div class="top">

      <img
        class="logo"
        src="https://yanuar-moga.github.io/assets/logo.jpg"
        alt="Logo">

    </div>


    <!-- LOGIN BODY -->

    <div class="login-body">


      <div class="brand">

        <h1>GURU WALI</h1>

        <p>
          Sistem Pemantauan Perkembangan Siswa
        </p>

      </div>


      <!-- ROLE -->

      <div class="roles">

        <button
          class="role active"
          data-role="WALI"
          onclick="selectRole('WALI')">

          👨‍🏫 GURU WALI

        </button>


        <button
          class="role"
          data-role="SISWA"
          onclick="selectRole('SISWA')">

          🎓 SISWA

        </button>

      </div>


      <!-- CREDENTIAL LABEL -->

      <label
        class="field-label"
        id="credentialLabel">

        PIN GURU

      </label>


      <!-- INPUT -->

      <div class="input-wrap">

        <input
          id="credential"
          class="login-input"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Masukkan PIN guru"
          onkeydown="if(event.key==='Enter')login()">


        <button
          class="eye"
          onclick="toggleEye()"
          type="button">

          👁

        </button>

      </div>


      <!-- REMEMBER -->

      <label class="remember">

        <input
          id="remember"
          type="checkbox"
          checked>

        Ingat perangkat ini

      </label>


      <!-- LOGIN -->

      <button
        class="login-btn"
        id="loginBtn"
        onclick="login()">

        MASUK

      </button>


      <!-- HELP -->

      <div
        class="login-help"
        id="loginHelp">

        PIN guru diverifikasi dari
        <b>UserAccount</b>.

      </div>


      <!-- FOOTER -->

      <div class="footer">

        SMP NEGERI 1 MOGA • GURU WALI

      </div>


    </div>

  </div>

</section>


<!-- =====================================================
     APPLICATION
===================================================== -->

<section id="app" class="hidden">


  <!-- HEADER -->

  <header class="header">

    <div class="header-left">

      <img
        class="header-logo"
        src="https://yanuar-moga.github.io/assets/logo.jpg"
        alt="Logo">


      <div>

        <h1>
          GURU WALI
        </h1>

        <small>
          SMP NEGERI 1 MOGA
        </small>

      </div>

    </div>


    <div
      style="
        display:flex;
        align-items:center;
        gap:8px">

      <span
        id="headerUser"
        style="
          font-size:10px;
          font-weight:700">
      </span>


      <button
        class="logout"
        onclick="logout()">

        Keluar

      </button>

    </div>

  </header>


  <!-- LAYOUT -->

  <div class="layout">


    <aside
      class="sidebar"
      id="sidebar">
    </aside>


    <main
      class="content"
      id="content">
    </main>


  </div>


  <!-- MOBILE NAV -->

  <nav
    class="mobile-nav"
    id="mobileNav">
  </nav>


</section>

/* =====================================================
   SESSION BROWSER
===================================================== */

const SESSION_KEY =
  'waliSiswaSession';


function saveSession(){

  if(!state.token || !state.role){

    return;

  }


  const data =
    JSON.stringify({

      token:state.token,

      role:state.role,

      user:state.user,

      section:state.section

    });


  try{

    if($('remember').checked){

      localStorage.setItem(
        SESSION_KEY,
        data
      );

      sessionStorage.removeItem(
        SESSION_KEY
      );

    }else{

      sessionStorage.setItem(
        SESSION_KEY,
        data
      );

      localStorage.removeItem(
        SESSION_KEY
      );

    }

  }catch(err){

    try{

      localStorage.setItem(
        SESSION_KEY,
        data
      );

    }catch(ignore){}

  }

}


function loadSession(){

  const stores = [

    localStorage,

    sessionStorage

  ];


  for(
    const store of stores
  ){

    try{

      const raw =
        store.getItem(
          SESSION_KEY
        );


      if(!raw){

        continue;

      }


      const parsed =
        JSON.parse(raw);


      if(
        parsed &&
        parsed.token &&
        parsed.role
      ){

        return parsed;

      }

    }catch(err){}

  }


  return null;

}


function clearSession(){

  try{

    localStorage.removeItem(
      SESSION_KEY
    );

  }catch(err){}


  try{

    sessionStorage.removeItem(
      SESSION_KEY
    );

  }catch(err){}

}


/* =====================================================
   API REQUEST
===================================================== */

async function api(
  action,
  data={}
){

  if(
    !API_URL ||
    API_URL.includes(
      'PASTE_URL'
    )
  ){

    throw new Error(
      'URL Web App GAS belum benar.'
    );

  }


  const response =
    await fetch(
      API_URL,
      {

        method:'POST',

        body:JSON.stringify(

          Object.assign(
            {action},
            data
          )

        )

      }
    );


  if(!response.ok){

    throw new Error(
      'Server GAS tidak merespons. HTTP ' +
      response.status
    );

  }


  const json =
    await response.json();


  if(!json.success){

    throw new Error(
      json.error ||
      'Terjadi kesalahan pada server.'
    );

  }


  return json;

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const credential =
    $('credential').value.trim();


  const role =
    currentRole();


  if(!credential){

    toast(
      'Masukkan PIN/NISN terlebih dahulu.',
      true
    );

    return;

  }


  const btn =
    $('loginBtn');


  btn.disabled=true;

  btn.textContent=
    'MEMERIKSA...';


  try{

    const result =
      await api(
        'login',
        {

          role:role,

          credential:credential

        }
      );


    state = {

      token:
        result.token,

      role:
        result.role,

      user:
        result.user,

      section:'home',

      students:[],

      selected:null

    };


    saveSession();


    showApp();


    await render();


    toast(
      'Login berhasil. Selamat datang, ' +
      (
        result.user?.NAMA ||
        ''
      )
    );


  }catch(err){

    toast(
      err.message ||
      'Login gagal.',
      true
    );


  }finally{

    btn.disabled=false;

    btn.textContent='MASUK';

  }

}


/* =====================================================
   AUTO LOGIN
===================================================== */

async function tryAutoLogin(){

  const saved =
    loadSession();


  if(
    !saved ||
    !saved.token ||
    !saved.role
  ){

    return;

  }


  state = {

    token:
      saved.token,

    role:
      saved.role,

    user:
      saved.user || null,

    section:
      saved.section || 'home',

    students:[],

    selected:null

  };


  showApp();


  try{

    await render();

  }catch(err){

    console.warn(
      'Render awal gagal:',
      err
    );

  }


  try{

    const result =
      await api(
        'validateSession',
        {

          token:saved.token

        }
      );


    if(result.valid){

      state.role =
        result.role ||
        state.role;


      if(result.user){

        state.user =
          Object.assign(
            {},
            state.user || {},
            result.user
          );

      }


      saveSession();


      try{

        await render();

      }catch(err){}

    }else{

      console.warn(
        'Server belum mengenali token. Sesi lokal tetap disimpan.'
      );

    }

  }catch(err){

    console.warn(
      'Validasi server gagal sementara.',
      err
    );

  }

}

function showApp(){

async function logout(){

/* =====================================================
   HELPERS
===================================================== */

function esc(v){

  return String(
    v ?? ''
  ).replace(
    /[&<>"']/g,
    function(m){

      return {

        '&':'&amp;',

        '<':'&lt;',

        '>':'&gt;',

        '"':'&quot;',

        "'":'&#039;'

      }[m];

    }
  );

}


function date(v){

  if(!v){

    return '-';

  }


  const d =
    new Date(v);


  if(
    isNaN(d)
  ){

    return esc(v);

  }


  return d.toLocaleDateString(
    'id-ID',
    {

      day:'2-digit',

      month:'short',

      year:'numeric'

    }
  );

}


function toast(
  msg,
  error=false
){

  const t =
    $('toast');


  t.textContent =
    msg;


  t.style.background =
    error
      ? '#B91C1C'
      : '#111827';


  t.classList.remove(
    'hidden'
  );


  clearTimeout(
    window.__toast
  );


  window.__toast =
    setTimeout(
      function(){

        t.classList.add(
          'hidden'
        );

      },
      3000
    );

}


function openModal(html){

                      Belum ada target.

                    </td>

                  </tr>

                `
              }

            </tbody>

          </table>

        </div>

      </div>

    `;

  }catch(err){

    $('content').innerHTML = `

      <div class="card empty">
        ${esc(err.message)}
      </div>

    `;

  }

}


/* =====================================================
   STUDENT MESSAGES
===================================================== */

async function renderStudentMessages(){

  try{

    const r =
      await getStudentData();


    $('content').innerHTML = `

      <h2 class="page-title">
        Pesan Wali
      </h2>


      <p class="page-sub">
        Pesan yang disampaikan wali
        secara khusus kepadamu.
      </p>


      <div class="grid">

        ${
          r.messages.length

          ? r.messages
              .map(function(x){

                const dibaca =
                  String(
                    x.STATUS_BACA
                  ).toLowerCase() ===
                  'dibaca';


                return `

                  <div class="card">

                    <div
                      style="
                        display:flex;
                        justify-content:space-between;
                        gap:10px">

                      <b style="font-size:12px">

                        ${esc(
                          x.JUDUL ||
                          'Pesan dari wali'
                        )}

                      </b>


                      <span
                        class="
                          badge
                          ${
                            dibaca
                              ? 'green'
                              : 'yellow'
                          }
                        ">

                        ${esc(
                          x.STATUS_BACA ||
                          'BELUM'
                        )}

                      </span>

                    </div>


                    <div
                      style="
                        font-size:9px;
                        color:#64748b;
                        margin-top:3px">

                      ${date(x.TANGGAL)}

                    </div>


                    <div
                      style="
                        font-size:10px;
                        line-height:1.7;
                        margin-top:8px">

                      ${esc(x.PESAN)}

                    </div>


                    ${
                      !dibaca

                      ? `

                        <button
                          class="btn btn-light"
                          style="margin-top:9px"
                          onclick="
                            readMessage(
                              '${esc(x.PESAN_ID)}'
                            )
                          ">

                          Tandai sudah dibaca

                        </button>

                      `

                      : ''

                    }

                  </div>

                `;

              })
              .join('')

          : `

            <div class="card empty">

              Belum ada pesan dari wali.

            </div>

          `
        }

      </div>

    `;

  }catch(err){

    $('content').innerHTML = `

      <div class="card empty">
        ${esc(err.message)}
      </div>

    `;

  }

}


async function readMessage(id){

  try{

    await api(
      'markMessageRead',
      {

        token:state.token,

        pesanId:id

      }
    );


    toast(
      'Pesan ditandai sudah dibaca.'
    );


    await renderStudentMessages();

  }catch(err){

    toast(
      err.message,
      true
    );

  }

}
