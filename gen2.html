<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b44ee">
<title>GURU WALI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#0b44ee;
  --blue2:#0635c9;
  --blue3:#082fae;
  --blue-soft:#eaf0ff;

  --lime:#ccff00;
  --lime-soft:#efffc2;

  --bg:#f4f6fb;
  --card:#ffffff;

  --text:#172033;
  --text-dark:#101828;
  --muted:#6b7280;

  --line:#e5e7eb;

  --danger:#ef4444;
  --danger-soft:#fee2e2;

  --success:#16a34a;
  --success-soft:#dcfce7;

  --warning:#f59e0b;
  --warning-soft:#fef3c7;

  --shadow-sm:0 4px 14px rgba(15,23,42,.06);
  --shadow:0 10px 30px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px rgba(15,23,42,.12);

  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================================================
   LOGIN
========================================================= */

#login{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 15%,rgba(11,68,238,.25),transparent 28%),
    radial-gradient(circle at 90% 80%,rgba(204,255,0,.10),transparent 25%),
    linear-gradient(145deg,#070b12,#0d1117 55%,#080c13);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px 15px;
  position:relative;
  overflow:hidden;
}

#login::before,
#login::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(1px);
  pointer-events:none;
}

#login::before{
  width:280px;
  height:280px;
  background:rgba(11,68,238,.10);
  top:-100px;
  left:-80px;
  animation:orbFloat 9s ease-in-out infinite;
}

#login::after{
  width:360px;
  height:360px;
  background:rgba(204,255,0,.06);
  bottom:-170px;
  right:-120px;
  animation:orbFloat2 11s ease-in-out infinite;
}

.login-card{
  width:100%;
  max-width:380px;
  min-height:700px;

  background:#0b44ee;
  border-radius:44px;

  overflow:hidden;
  position:relative;
  z-index:2;

  box-shadow:
    0 35px 90px rgba(0,0,0,.45),
    0 0 0 1px rgba(255,255,255,.06);

  animation:loginCardIn .8s cubic-bezier(.2,.8,.2,1);
}

.login-top{
  height:255px;
  background:#fff;
  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;

  padding-top:43px;
}

.login-top::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:-10%;
  width:120%;
  height:85px;
  background:var(--blue);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

.logo-wrap{
  width:118px;
  height:118px;
  border-radius:34px;

  padding:4px;
  background:#fff;

  box-shadow:
    0 15px 35px rgba(11,68,238,.20),
    0 0 0 8px rgba(11,68,238,.05);

  position:relative;
  z-index:3;

  animation:
    logoEntrance .8s .15s both,
    logoFloat 4s 1.2s ease-in-out infinite,
    logoGlow 3s 1.2s ease-in-out infinite;
}

.logo-wrap img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:29px;
}

.login-brand{
  margin-top:18px;
  color:var(--blue);
  font-size:25px;
  font-weight:800;
  letter-spacing:1px;
  position:relative;
  z-index:4;

  animation:brandIn .7s .35s both;
}

.login-brand::after{
  content:"";
  position:absolute;
  height:4px;
  width:38px;
  border-radius:20px;
  background:var(--lime);
  bottom:-9px;
  left:50%;
  transform:translateX(-50%);
  animation:brandLine .8s .8s both;
}

.login-subtitle{
  color:#7b8190;
  font-size:10px;
  margin-top:12px;
  position:relative;
  z-index:4;
  animation:subtitleIn .7s .5s both;
}

.login-body{
  padding:12px 30px 30px;
  color:#fff;
  animation:formIn .7s .55s both;
}

.login-heading{
  font-size:21px;
  font-weight:700;
  text-align:center;
  margin-bottom:5px;
}

.login-description{
  text-align:center;
  color:rgba(255,255,255,.72);
  font-size:11px;
  margin-bottom:22px;
}

.role-title{
  font-size:11px;
  font-weight:600;
  color:rgba(255,255,255,.72);
  margin-bottom:8px;
}

.role-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:16px;
}

.role-btn{
  border:1px solid rgba(255,255,255,.20);
  background:rgba(255,255,255,.09);
  color:#fff;
  height:46px;
  border-radius:13px;

  font-size:12px;
  font-weight:700;

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.role-btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.15);
}

.role-btn.active{
  background:var(--lime);
  color:#101010;
  border-color:var(--lime);
  box-shadow:0 8px 22px rgba(204,255,0,.20);
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:rgba(255,255,255,.75);
  margin-bottom:7px;
}

.input-wrap{
  position:relative;
}

.input{
  width:100%;
  height:48px;
  border:none;
  outline:none;

  background:#fff;
  color:#172033;

  border-radius:13px;
  padding:0 48px 0 15px;

  font-size:13px;
  font-weight:500;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.input:hover{
  box-shadow:0 5px 15px rgba(0,0,0,.10);
}

.input:focus{
  transform:translateY(-1px);
  box-shadow:
    0 0 0 3px rgba(204,255,0,.28),
    0 8px 20px rgba(0,0,0,.12);
}

.eye-btn{
  position:absolute;
  right:5px;
  top:5px;
  width:38px;
  height:38px;

  border:none;
  border-radius:10px;

  background:transparent;
  color:#6b7280;

  font-size:16px;
}

.eye-btn:hover{
  background:#f2f4f7;
}

.remember{
  display:flex;
  align-items:center;
  gap:8px;
  margin:2px 0 17px;

  font-size:10px;
  color:rgba(255,255,255,.72);
}

.remember input{
  accent-color:var(--lime);
}

.login-btn{
  width:100%;
  height:50px;

  border:none;
  border-radius:14px;

  background:var(--lime);
  color:#111;

  font-size:13px;
  font-weight:800;

  position:relative;
  overflow:hidden;

  box-shadow:0 12px 28px rgba(0,0,0,.15);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.login-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.55),
    transparent
  );

  transform:skewX(-20deg);
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 32px rgba(0,0,0,.22);
}

.login-btn:hover::before{
  animation:buttonShine .8s ease;
}

.login-btn:active{
  transform:translateY(0);
}

.login-help{
  margin-top:17px;
  text-align:center;
  font-size:9px;
  line-height:1.6;
  color:rgba(255,255,255,.55);
}

.login-footer{
  text-align:center;
  font-size:8px;
  color:rgba(255,255,255,.35);
  margin-top:18px;
  animation:fadeUp .8s 1s both;
}

.loading-dots{
  display:inline-flex;
  gap:4px;
  margin-left:5px;
  vertical-align:middle;
}

.loading-dots span{
  width:4px;
  height:4px;
  background:currentColor;
  border-radius:50%;
  animation:dotPulse 1s infinite;
}

.loading-dots span:nth-child(2){
  animation-delay:.15s;
}

.loading-dots span:nth-child(3){
  animation-delay:.3s;
}

/* =========================================================
   APP
========================================================= */

#app{
  display:none;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(11,68,238,.04),transparent 25%),
    var(--bg);
}

/* HEADER */

.app-header{
  height:72px;

  background:
    linear-gradient(135deg,var(--blue),var(--blue2));

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 26px;

  position:sticky;
  top:0;
  z-index:50;

  box-shadow:0 5px 20px rgba(11,68,238,.18);
}

.app-header::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:2px;
  background:var(--lime);
  opacity:.85;
}

.header-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.header-logo{
  width:43px;
  height:43px;
  border-radius:13px;
  object-fit:cover;

  background:#fff;
  padding:2px;

  box-shadow:0 5px 15px rgba(0,0,0,.16);

  animation:logoFloat 4s ease-in-out infinite;
}

.header-brand{
  display:flex;
  flex-direction:column;
}

.header-title{
  font-size:16px;
  font-weight:800;
  line-height:1.1;
  letter-spacing:.3px;
}

.header-subtitle{
  font-size:9px;
  color:rgba(255,255,255,.68);
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-badge{
  display:flex;
  align-items:center;
  gap:8px;

  padding:7px 11px;
  border-radius:30px;

  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.13);

  font-size:10px;
}

.user-avatar{
  width:27px;
  height:27px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--lime);
  color:#101010;

  font-size:10px;
  font-weight:800;
}

.logout-btn{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.09);
  color:#fff;

  height:38px;
  padding:0 13px;

  border-radius:11px;

  font-size:10px;
  font-weight:700;

  transition:.2s ease;
}

.logout-btn:hover{
  background:var(--lime);
  border-color:var(--lime);
  color:#111;
  transform:translateY(-1px);
}

/* LAYOUT */

.app-layout{
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  min-height:calc(100vh - 72px);
}

/* SIDEBAR */

.sidebar{
  background:#fff;
  border-right:1px solid var(--line);

  padding:20px 13px;

  position:sticky;
  top:72px;
  height:calc(100vh - 72px);

  overflow-y:auto;
}

.sidebar-section{
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#9ca3af;

  font-weight:800;

  margin:9px 10px 8px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav-item{
  width:100%;
  height:44px;

  border:none;
  background:transparent;

  color:#6b7280;

  border-radius:12px;

  display:flex;
  align-items:center;
  gap:11px;

  padding:0 12px;

  text-align:left;

  font-size:11px;
  font-weight:600;

  position:relative;

  transition:.2s ease;
}

.nav-item:hover{
  background:var(--blue-soft);
  color:var(--blue);
  transform:translateX(2px);
}

.nav-item.active{
  background:linear-gradient(
    135deg,
    var(--blue),
    var(--blue2)
  );
  color:#fff;

  box-shadow:0 8px 20px rgba(11,68,238,.18);
}

.nav-item.active::after{
  content:"";
  position:absolute;
  right:7px;
  width:4px;
  height:22px;
  border-radius:5px;
  background:var(--lime);
}

.nav-icon{
  width:23px;
  text-align:center;
  font-size:15px;
}

/* MAIN */

.main{
  padding:28px;
  min-width:0;
}

.page{
  max-width:1180px;
  margin:auto;

  animation:pageIn .45s ease;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;

  margin-bottom:22px;
}

.page-title{
  font-size:24px;
  font-weight:800;
  color:var(--text-dark);
}

.page-desc{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.page-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* CARDS */

.card{
  background:#fff;
  border:1px solid rgba(229,231,235,.8);
  border-radius:var(--radius);

  box-shadow:var(--shadow-sm);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
  border-color:#dbe3ff;
}

.card-head{
  padding:18px 19px 0;
}

.card-title{
  font-size:14px;
  font-weight:750;
  color:var(--text-dark);
}

.card-subtitle{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}

.card-body{
  padding:18px 19px;
}

/* HERO */

.hero{
  background:
    radial-gradient(circle at 90% 20%,rgba(204,255,0,.12),transparent 25%),
    linear-gradient(135deg,var(--blue),var(--blue2));

  color:#fff;

  border-radius:24px;
  padding:25px;

  position:relative;
  overflow:hidden;

  margin-bottom:20px;

  box-shadow:0 16px 35px rgba(11,68,238,.18);
}

.hero::before{
  content:"";
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  right:-80px;
  top:-90px;
  border:30px solid rgba(255,255,255,.05);
}

.hero::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  left:45%;
  bottom:-70px;
  background:rgba(204,255,0,.07);
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero-kicker{
  color:var(--lime);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}

.hero-title{
  font-size:24px;
  line-height:1.25;
  font-weight:800;
}

.hero-text{
  color:rgba(255,255,255,.75);
  font-size:11px;
  max-width:600px;
  margin-top:7px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;

  box-shadow:var(--shadow-sm);

  position:relative;
  overflow:hidden;

  transition:.22s ease;
}

.stat-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.stat-card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--blue);
}

.stat-icon{
  width:34px;
  height:34px;
  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--blue-soft);
  color:var(--blue);

  font-size:15px;
  margin-bottom:10px;
}

.stat-label{
  font-size:9px;
  color:var(--muted);
  font-weight:600;
}

.stat-value{
  font-size:24px;
  font-weight:800;
  color:var(--blue);
  line-height:1.2;
  margin-top:3px;
}

/* BUTTONS */

.btn{
  height:39px;
  border-radius:11px;
  padding:0 14px;

  border:1px solid var(--line);

  background:#fff;
  color:var(--text);

  font-size:10px;
  font-weight:700;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}

.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  border-color:var(--blue);
  color:#fff;
}

.btn-primary:hover{
  box-shadow:0 8px 20px rgba(11,68,238,.20);
}

.btn-lime{
  background:var(--lime);
  border-color:var(--lime);
  color:#111;
}

.btn-danger{
  background:var(--danger-soft);
  border-color:#fecaca;
  color:#b91c1c;
}

.btn-small{
  height:32px;
  padding:0 10px;
  font-size:9px;
}

/* SEARCH */

.search-box{
  position:relative;
  margin-bottom:14px;
}

.search-box input{
  width:100%;
  height:43px;

  border:1px solid var(--line);
  border-radius:12px;

  outline:none;

  padding:0 14px 0 38px;

  background:#fff;
  font-size:11px;

  transition:.2s ease;
}

.search-box input:focus{
  border-color:#9bb2ff;
  box-shadow:0 0 0 3px rgba(11,68,238,.08);
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#9ca3af;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th{
  background:#f8faff;
  color:#6b7280;

  font-size:9px;
  text-align:left;

  padding:12px 10px;

  border-bottom:1px solid var(--line);

  white-space:nowrap;
}

.table td{
  padding:12px 10px;

  border-bottom:1px solid #f0f1f3;

  font-size:10px;

  vertical-align:middle;
}

.table tr:last-child td{
  border-bottom:none;
}

.table tbody tr{
  transition:.15s ease;
}

.table tbody tr:hover{
  background:#f8faff;
}

.student-cell{
  display:flex;
  align-items:center;
  gap:9px;
}

.student-photo{
  width:35px;
  height:35px;
  border-radius:10px;
  object-fit:cover;
  background:#eaf0ff;
}

.student-initial{
  width:35px;
  height:35px;
  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--blue-soft);
  color:var(--blue);

  font-weight:800;
  font-size:11px;
}

.student-name{
  font-weight:700;
  color:var(--text-dark);
}

.student-meta{
  font-size:8px;
  color:#9ca3af;
  margin-top:2px;
}

/* BADGES */

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:23px;
  padding:3px 8px;

  border-radius:30px;

  font-size:8px;
  font-weight:700;
}

.badge-blue{
  background:var(--blue-soft);
  color:var(--blue);
}

.badge-green{
  background:var(--success-soft);
  color:#15803d;
}

.badge-yellow{
  background:var(--warning-soft);
  color:#b45309;
}

.badge-red{
  background:var(--danger-soft);
  color:#b91c1c;
}

.badge-gray{
  background:#f3f4f6;
  color:#6b7280;
}

/* GRID */

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:17px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
}

/* PROFILE */

.profile-top{
  display:flex;
  align-items:center;
  gap:16px;

  padding:20px;
}

.profile-photo{
  width:76px;
  height:76px;
  border-radius:20px;
  object-fit:cover;
  background:var(--blue-soft);
}

.profile-name{
  font-size:19px;
  font-weight:800;
  color:var(--text-dark);
}

.profile-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-item{
  background:#f8faff;

/* TIMELINE */

.timeline{
  position:relative;
  padding-left:23px;

.timeline::before{

  left:6px;
  top:5px;
  bottom:5px;
  width:2px;
  background:#dbe3ff;
}

.timeline-item{
  position:relative;
  padding-bottom:20px;

.timeline-item:last-child{
  padding-bottom:0;

.timeline-dot{

  width:14px;
  height:14px;

  background:var(--blue);

  border-radius:50%;

  box-shadow:0 0 0 2px #dbe3ff;

}

.timeline-title{
  font-size:11px;
  font-weight:750;
  color:var(--text-dark);
}

  font-size:10px;
  color:#6b7280;
  margin-top:3px;

/* EMPTY */

.empty{

/* FORM */

.form-group{

.form-label{

.form-control{

  border:1px solid var(--line);
  border-radius:10px;

}

/* TARGET */

}

  line-height:1.5;
}

  margin-top:9px;

/* MESSAGE */

.message{
  padding:15px;

  border:1px solid var(--line);
  border-radius:14px;

  margin-bottom:10px;

  transition:.2s ease;
}

.message:hover{

  background:#fbfcff;
}

}

.message-head{

  justify-content:space-between;

.message-title{

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;

  background:rgba(15,23,42,.55);

  backdrop-filter:blur(6px);

  display:none;
  align-items:center;
  justify-content:center;

  padding:18px;

  z-index:100;
}

}

.modal{

  max-width:620px;
  max-height:90vh;

  overflow-y:auto;

  background:#fff;

  border-radius:22px;

  box-shadow:0 30px 80px rgba(0,0,0,.25);

}

.modal-head{
  display:flex;

}

}

.spinner{

  height:18px;

<!-- =========================================================
     LOGIN
========================================================= -->

<section id="login">

  <div class="login-card">

          src="https://yanuar-moga.github.io/assets/logo.jpg"
          alt="Logo"
        >
      </div>

      <div class="login-brand">
        GURU WALI
      </div>

      <div class="login-subtitle">
        Sistem Pendampingan Perjalanan Siswa
      </div>

    </div>

    <div class="login-body">

      <div class="login-heading">
        Selamat Datang
      </div>

      <div class="login-description">
        Silakan masuk untuk melanjutkan
      </div>

      <div class="role-title">
        Masuk sebagai
      </div>

      <div class="role-buttons">

        <button
          type="button"
          class="role-btn active"
          id="roleWali"
          onclick="selectRole('WALI')"

        <button

          class="role-btn"
          id="roleSiswa"

          >

          <button

            class="eye-btn"
            onclick="toggleEye()"
            aria-label="Tampilkan PIN"

          type="checkbox"
          id="remember"

        class="login-btn"
        id="loginButton"
        onclick="login()"
      >

      </button>

        Jika mengalami kendala saat login,<br>
        silakan hubungi wali kelas / admin.

     MODAL
========================================================= -->

  class="modal-overlay"
  id="modalOverlay"
  onclick="if(event.target===this) closeModal()"
>

    <div class="modal-head">

        class="modal-title"
        id="modalTitle"
      >
        Form
      </div>

        class="modal-close"
        onclick="closeModal()"

        ×
      </button>

<script>
/* =========================================================
   CONFIG
========================================================= */

const API =
  'https://script.google.com/macros/s/AKfycbxTZZxRMS4GbN_tca3kEn1hibajLsuqPdsIkVLF-lh9aqO3dDTy8oyJb6HDaZhfxhFfvQ/exec';

const SESSION_KEY = 'waliSiswaSession';


/* =========================================================
   STATE
========================================================= */

let state = {
  token:null,
  role:null,
  user:null,
  section:'home',
  students:[],
  selected:null,
  studentData:null
};


/* =========================================================
   LOGIN
========================================================= */

function selectRole(role){

  state.role = role;

  document.getElementById('roleWali')
    .classList.toggle('active',role === 'WALI');

  document.getElementById('roleSiswa')
    .classList.toggle('active',role === 'SISWA');

}


function currentRole(){
  return state.role || 'WALI';
}


function toggleEye(){

  const input = document.getElementById('pin');

  input.type =
    input.type === 'password'
      ? 'text'
      : 'password';

}


function saveSession(session){

  const remember =
    document.getElementById('remember').checked;

  if(remember){

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );

    sessionStorage.removeItem(SESSION_KEY);

  }else{

    sessionStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );

    localStorage.removeItem(SESSION_KEY);

  }

}


function loadSession(){

  let raw =
    localStorage.getItem(SESSION_KEY);

  if(!raw){

    raw =
      sessionStorage.getItem(SESSION_KEY);

  }

  if(!raw) return null;

  try{

    return JSON.parse(raw);

  }catch(e){

    return null;

  }

}


function clearSession(){

  localStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_KEY);

}


async function api(action,payload={}){

  const body = {
    action,
    ...payload
  };

  const response =
    await fetch(API,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain;charset=utf-8'
      },
      body:JSON.stringify(body)
    });

  const text =
    await response.text();

  let data;

  try{

    data = JSON.parse(text);

  }catch(e){

    throw new Error(
      'Respons server tidak valid.'
    );

  }

  if(
    data &&
    data.success === false
  ){

    throw new Error(
      data.message ||
      'Terjadi kesalahan.'
    );

  }

  return data;

}


async function login(){

  const pin =
    document.getElementById('pin').value.trim();

  if(!pin){

    toast('PIN wajib diisi.');

    document.getElementById('pin').focus();

    return;

  }

  const button =
    document.getElementById('loginButton');

  button.disabled = true;

  button.innerHTML =
    'MEMPROSES <span class="loading-dots"><span></span><span></span><span></span></span>';

  try{

    const data =
      await api('login',{
        role:currentRole(),
        pin:pin
      });

    if(!data.success){

      throw new Error(
        data.message ||
        'Login gagal.'
      );

    }

    state.token =
      data.token ||
      data.sessionToken ||
      data.data?.token;

    state.role =
      data.role ||
      currentRole();

    state.user =
      data.user ||
      data.data?.user ||
      data.data ||
      {};

    saveSession({
      token:state.token,
      role:state.role,
      user:state.user
    });

    showApp();

    toast('Login berhasil.');

  }catch(error){

    toast(
      error.message ||
      'Login gagal.'
    );

  }finally{

    button.disabled = false;
    button.innerHTML = 'MASUK';

  }

}


async function tryAutoLogin(){

  const session =
    loadSession();

  if(!session) return;

  state.token =
    session.token;

  state.role =
    session.role;

  state.user =
    session.user;

  if(!state.token) return;

  showApp();

  /*
   * Validasi dilakukan di background.
   * Session tetap dipertahankan apabila validasi
   * server gagal, sesuai perilaku aplikasi sebelumnya.
   */

  try{

    const data =
      await api('validateSession',{
        token:state.token
      });

    if(data && data.user){

      state.user =
        data.user;

      saveSession({
        token:state.token,
        role:state.role,
        user:state.user
      });

      updateUserHeader();

    }

  }catch(error){

    console.log(
      'Validasi session:',
      error.message
    );

  }

}


/* =========================================================
   APP
========================================================= */

function showApp(){

  document.getElementById('login').style.display =
    'none';

  document.getElementById('app').style.display =
    'block';

  updateUserHeader();

  renderNav();

  render();

}


function updateUserHeader(){

  const user =
    state.user || {};

  const name =
    user.NAMA ||
    user.nama ||
    user.name ||
    user.NAMA_GURU ||
    user.NAMA_SISWA ||
    'Pengguna';

  document.getElementById('userName').textContent =
    name;

  const avatar =
    name
      .trim()
      .charAt(0)
      .toUpperCase();

  document.getElementById('userAvatar').textContent =
    avatar;

}


async function logout(){

  try{

    if(state.token){

/* =========================================================
   UTILITIES
========================================================= */

function esc(value){

  if(value === null || value === undefined)
    return '';

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function date(value){

  if(!value) return '-';

  try{

    const d =
      new Date(value);

    if(isNaN(d)) return value;

    return d.toLocaleDateString(
      'id-ID',
      {
        day:'2-digit',
        month:'short',
        year:'numeric'
      }
    );

  }catch(e){

    return value;

  }

}


function toast(message){

  const el =
    document.getElementById('toast');

  el.textContent =
    message;

  el.classList.add('show');

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => el.classList.remove('show'),
      3000
    );

}


function openModal(title,body,footer=''){

  document.getElementById('modalTitle')
    .textContent = title;

  document.getElementById('modalBody')
    .innerHTML = body;

  document.getElementById('modalFooter')
    .innerHTML = footer;

  document.getElementById('modalOverlay')
    .classList.add('show');

}


function closeModal(){

  document.getElementById('modalOverlay')
    .classList.remove('show');

}


function stat(icon,label,value){

  return `
    <div class="stat-card">

      <div class="stat-icon">
        ${icon}
      </div>

      <div class="stat-label">
        ${esc(label)}
      </div>

      <div class="stat-value">
        ${esc(value)}
      </div>

    </div>
  `;

}

function openTargetForm(id){

  state.selected =
    id ||
    state.selected;

  const body = `

    <div class="form-grid">

      <div class="form-group full">

        <label class="form-label">
          Target
        </label>

        <textarea
          class="form-control"
          id="form_TARGET"
          placeholder="Tuliskan target siswa..."
        ></textarea>

      </div>

      <div class="form-group full">

        <label class="form-label">
          Indikator
        </label>

        <textarea
          class="form-control"
          id="form_INDIKATOR"
          placeholder="Bagaimana target dinyatakan tercapai?"
        ></textarea>

      </div>

      ${fg(
        'BATAS_WAKTU',
        'Batas Waktu',
        'date'
      )}

      <div class="form-group full">

        <label class="form-label">
          Tindak Lanjut
        </label>

        <textarea
          class="form-control"
          id="form_TARGET_TINDAK_LANJUT"
          placeholder="Tindak lanjut yang dilakukan..."
        ></textarea>

      </div>

      ${fg(
        'STATUS',
        'Status',
        'text',
        'Aktif',
        'Aktif / Selesai'
      )}

    </div>
  `;

  openModal(
    'Tambah Target',
    body,
    `
      <button
        class="btn"
        onclick="closeModal()"
      >
        Batal
      </button>

      <button
        class="btn btn-lime"
        onclick="saveTarget()"
      >
        Simpan Target
      </button>
    `
  );

}


async function saveTarget(){

  const payload = {

    token:state.token,

    SISWA_ID:
      state.selected,

    TARGET:
      document.getElementById('form_TARGET').value,

    INDIKATOR:
      document.getElementById('form_INDIKATOR').value,

    BATAS_WAKTU:
      document.getElementById('form_BATAS_WAKTU').value,

    TINDAK_LANJUT:
      document.getElementById(
        'form_TARGET_TINDAK_LANJUT'
      ).value,

    STATUS:
      document.getElementById('form_STATUS').value

  };

  try{

    await api('addTarget',payload);

    closeModal();

    toast('Target berhasil ditambahkan.');

    render();

  }catch(error){

    toast(
      error.message ||
      'Gagal menyimpan target.'
    );

  }

}

async function getStudentData(){

  const data =
    await api('studentDashboard',{
      token:state.token
    });

  state.studentData =
    data.data ||
    data;

  return state.studentData;

}


async function renderStudentPage(){

  switch(state.section){

    case 'history':
      await renderStudentTimeline();
      break;

    case 'notes':
      await renderStudentNotes();
      break;

    case 'targets':
      await renderStudentTargets();
      break;

    case 'messages':
      await renderStudentMessages();
      break;

    default:
      await renderStudentHome();

  }

}

function historyHTML(items=[]){

  if(!items.length){

    return `
      <div class="empty">
        <div class="empty-icon">◷</div>
        <div class="empty-title">
          Belum ada perjalanan
        </div>
        <div class="empty-text">
          Catatan perjalananmu akan muncul di sini.
        </div>
      </div>
    `;

  }

  return `

    <div class="timeline">

      ${items.map(item => `

        <div class="timeline-item">

          <div class="timeline-dot"></div>

          <div class="timeline-date">
            ${date(item.TANGGAL)}
          </div>

          <div class="timeline-title">
            ${esc(
              item.TOPIK ||
              item.JENIS ||
              'Catatan'
            )}
          </div>

          <div class="timeline-text">
            ${esc(
              item.CATATAN_SISWA ||
              item.PERKEMBANGAN ||
              '-'
            )}
          </div>

        </div>

      `).join('')}

    </div>
  `;

}
